<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found</title>
<script>
// GitHub Pages serves this for unknown paths. /message (or /messages) and /me open those routes of the single-page site.
(function () {
  var m = location.pathname.match(/^(.*\/)(messages?|me)\/?$/);
  if (m) location.replace(m[1] + "#" + (m[2] === "me" ? "me" : "message"));
})();
</script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080B12;color:#E8ECF4;font:16px system-ui,sans-serif;text-align:center}a{color:#5EE6FF}</style>
</head>
<body>
<p>This page doesn't exist. <a href="./">Go to the homepage</a></p>
</body>
</html>
