<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<!--page-start-->
<title>Rahul Jaiswal Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: floating CardNav, aurora hero + terminal, stats, scroll-expanding "currently building" stage, tilt/spotlight work grid, velocity marquees, scroll-reveal about, timeline, dock contact */
:root{
  --ink:#080B12;
  --panel:#0F1420;
  --panel-2:#141B2A;
  --line:#1E2638;
  --fg:#E8ECF4;
  --muted:#8A94AB;
  --cyan:#5EE6FF;
  --amber:#FFB547;
  --ok:#5BE39A;
  --c-cyan:#0D2730;
  --c-amber:#2A2113;
  --c-violet:#1E1A33;
  --violet:#A99BFF;
  --rose:#FF8FC0;
  --f-display:"Syne","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;overflow-x:hidden}
a{color:inherit}
::selection{background:var(--cyan);color:var(--ink)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- overlay (swarm cursor + click spark) ---------- */
#net{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#root{position:relative;z-index:1}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}

/* ---------- CardNav ---------- */
.cn-wrap{position:absolute;z-index:30;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 14px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.cardnav{pointer-events:auto;max-width:920px;margin:0 auto;background:color-mix(in srgb,var(--panel) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:height .45s cubic-bezier(.2,.8,.2,1);box-shadow:0 20px 50px -25px rgba(0,0,0,.9)}
.cn-top{height:58px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px 0 12px}
.hamb{width:40px;height:40px;border:0;background:none;cursor:pointer;display:grid;place-content:center;gap:6px;padding:0}
.hamb span{display:block;width:22px;height:2px;background:var(--fg);border-radius:2px;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.open .hamb span:first-child{transform:translateY(4px) rotate(45deg)}
.open .hamb span:last-child{transform:translateY(-4px) rotate(-45deg)}
.logo{font-family:var(--f-mono);font-size:14px;text-decoration:none;justify-self:center}
.logo b{color:var(--cyan);font-weight:500}
.cn-cta{justify-self:end;padding:9px 16px;font-size:14px}
.cn-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:4px 8px 8px}
.cn-card{border-radius:12px;padding:16px 16px 18px;min-height:150px;display:flex;flex-direction:column;gap:6px;opacity:0;transform:translateY(16px);transition:opacity .35s, transform .45s cubic-bezier(.2,.8,.2,1)}
.open .cn-card{opacity:1;transform:none}
.open .cn-card:nth-child(2){transition-delay:.06s}
.open .cn-card:nth-child(3){transition-delay:.12s}
.open .cn-card:nth-child(4){transition-delay:.18s}
@media (max-width:860px){.cn-cards{grid-template-columns:repeat(2,1fr)}}
.cn-card h5{font-family:var(--f-display);font-size:20px;margin:0 0 auto;font-weight:700}
.cn-card a{text-decoration:none;font-size:15px;color:var(--muted);display:flex;align-items:baseline;gap:6px;transition:color .2s}
.cn-card a:hover{color:var(--fg)}
.cn-card a::before{content:"↗";font-size:12px}
@media (max-width:640px){.cn-cards{grid-template-columns:1fr}.cn-card{min-height:0}.cn-card h5{margin-bottom:6px}.cn-cta{display:none}.cn-top{grid-template-columns:auto 1fr auto}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;font-family:inherit;transition:border-color .2s,transform .25s cubic-bezier(.2,.8,.2,1)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--cyan);color:var(--ink);border-color:var(--cyan)}
/* StarBorder */
.star{position:relative;display:inline-flex;border-radius:999px;padding:1px;overflow:hidden;text-decoration:none}
.star::before,.star::after{content:"";position:absolute;width:300%;height:50%;border-radius:50%;opacity:.9;background:radial-gradient(circle,var(--cyan),transparent 12%)}
.star::before{bottom:-12px;right:-250%;animation:starB 5s linear infinite alternate}
.star::after{top:-12px;left:-250%;animation:starT 5s linear infinite alternate}
@keyframes starB{to{transform:translateX(-100%)}}
@keyframes starT{to{transform:translateX(100%)}}
.star span{position:relative;z-index:1;display:inline-flex;gap:8px;align-items:center;padding:12px 22px;border-radius:999px;background:linear-gradient(180deg,var(--panel-2),var(--ink));border:1px solid var(--line);font-weight:600;font-size:15px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.6}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 70%,color-mix(in srgb,var(--ink) 60%,transparent));pointer-events:none}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.25fr 1fr;gap:48px;align-items:center;padding-block:140px 88px}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr;padding-block:110px 64px}}
.hero-text{min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 22%,transparent);flex:none}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(44px,11vw,92px);line-height:.95;letter-spacing:-.03em;margin:18px 0;text-wrap:balance}
.split{display:inline-block;white-space:nowrap}
@media (min-width:901px){h1{font-size:clamp(44px,7.4vw,92px)}}
.split span{display:inline-block;animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:translateY(40%);opacity:0;filter:blur(6px)}to{transform:none;opacity:1;filter:none}}
.role{font-family:var(--f-mono);font-size:clamp(15px,2vw,18px);color:var(--cyan);min-height:1.6em}
.lede{max-width:56ch;color:var(--muted);font-size:17px;margin:18px 0 30px}
.shiny{background:linear-gradient(110deg,var(--fg) 35%,#fff 50%,var(--fg) 65%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite;font-weight:600}
@keyframes shine{from{background-position:100% 0}to{background-position:-100% 0}}
.cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* terminal */
.term{min-width:0;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:14px;font-family:var(--f-mono);font-size:13px;box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
.term-bar{display:flex;gap:7px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.term-bar i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.term-bar span{margin-left:8px;color:var(--muted);font-size:12px}
.term-body{padding:16px 18px 20px;overflow-x:auto;line-height:1.75}
.term-body .p{color:var(--cyan)}
.term-body .c{color:var(--muted)}
.term-body table{border-collapse:collapse;white-space:nowrap}
.term-body td{padding-right:22px}
.done-t{color:var(--ok)}
.now-t{color:var(--amber)}
.cursor{display:inline-block;width:8px;height:15px;background:var(--cyan);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.stat{padding:28px 20px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--f-display);font-size:clamp(34px,5vw,48px);line-height:1;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:8px;color:var(--muted);font-size:14px}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}}

/* ---------- ScrollExpand stage ---------- */
.xp{position:relative;height:230vh}
.xp-sticky{position:sticky;top:0;height:100vh;height:100svh;display:grid;place-items:center;overflow:hidden}
.xp-box{position:relative;width:min(1100px,calc(100% - 32px));height:min(76svh,640px);border-radius:20px;background:var(--panel);border:1px solid var(--line);overflow:hidden;will-change:clip-path}
.xp-dim{position:absolute;inset:0;background:var(--ink);pointer-events:none}
.xp-title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;pointer-events:none;z-index:2;font-family:var(--f-display);font-weight:800;font-size:clamp(44px,10vw,128px);line-height:.9;letter-spacing:-.03em;text-shadow:0 10px 40px rgba(0,0,0,.6)}
.xp-title span:last-child{color:var(--amber)}
.xp-cap{position:absolute;left:0;right:0;bottom:calc(50% - min(38svh,320px) - 44px);text-align:center;font-family:var(--f-mono);font-size:13px;color:var(--muted);padding:0 16px}
/* mock CAF */
.mock{position:absolute;inset:0;display:grid;grid-template-columns:220px 1fr 300px;font-size:14px}
.mock-side{border-right:1px solid var(--line);padding:20px 16px;display:grid;align-content:start;gap:4px;background:var(--panel-2)}
.mock-side h6{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:500}
.step{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--muted)}
.step i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:10px;flex:none}
.step.ok i{background:var(--ok);border-color:var(--ok);color:var(--ink)}
.step.cur{background:var(--c-amber);color:var(--fg)}
.step.cur i{border-color:var(--amber)}
.mock-main{padding:24px 28px;display:grid;align-content:start;gap:18px;min-width:0}
.mock-main h4{font-family:var(--f-display);font-size:24px;margin:0}
.prog{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.prog b{display:block;height:100%;width:62%;background:linear-gradient(90deg,var(--cyan),var(--amber))}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.field div{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--ink);padding:0 12px;display:flex;align-items:center;font-family:var(--f-mono);font-size:13px}
.field.err div{border-color:var(--amber)}
.field small{display:block;color:var(--amber);font-size:12px;margin-top:4px}
.mock-log{border-left:1px solid var(--line);padding:20px 18px;font-family:var(--f-mono);font-size:12px;display:grid;align-content:start;gap:10px;background:var(--panel-2)}
.mock-log h6{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;font-weight:500}
.mock-log p{margin:0;color:var(--muted);line-height:1.55}
.mock-log p b{color:var(--fg);font-weight:500}
.xp-table{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px}
.xr{display:grid;grid-template-columns:2fr 1fr 1.2fr;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.xr.xh{border-top:0;background:var(--panel-2);color:var(--muted);font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.tagnote{position:absolute;right:14px;bottom:12px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
@media (max-width:900px){.mock{grid-template-columns:1fr}.mock-side,.mock-log{display:none}.fields{grid-template-columns:1fr}}

/* ---------- sections ---------- */
section{padding-block:96px}
@media (max-width:640px){section{padding-block:64px}}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:40px}
.sec-head h2{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,5vw,52px);line-height:1.05;letter-spacing:-.02em;margin:8px 0 0;text-wrap:balance}
.sec-head p{max-width:42ch;color:var(--muted);margin:0}
.tag{font-family:var(--f-mono);font-size:13px;color:var(--amber)}

/* AnimatedContent: only elements that start below the fold get the pre state */
.ac{transition:opacity .9s cubic-bezier(.2,.8,.2,1),transform .9s cubic-bezier(.2,.8,.2,1)}
.ac.pre{opacity:0;transform:translateY(56px) scale(.97)}

/* Tilted + Spotlight cards */
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;perspective:1200px}
.card{grid-column:span 3;position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;min-width:0;display:flex;flex-direction:column;gap:14px;--x:50%;--y:50%;--rx:0deg;--ry:0deg;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .5s cubic-bezier(.2,.8,.2,1),border-color .3s}
.card.tilting{transition:transform .08s linear,border-color .3s}
.card:hover{border-color:color-mix(in srgb,var(--cyan) 35%,var(--line))}
.card.feature{grid-column:span 6;display:grid;grid-template-columns:1.1fr 1fr;gap:32px;padding:34px;background:linear-gradient(135deg,var(--c-amber),var(--panel) 55%)}
.card.feature > div{display:flex;flex-direction:column;gap:14px;min-width:0}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(420px circle at var(--x) var(--y),color-mix(in srgb,var(--cyan) 14%,transparent),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover::before{opacity:1}
.card h3{font-family:var(--f-display);font-size:22px;line-height:1.2;margin:0;font-weight:700}
.card.feature h3{font-size:clamp(26px,3.5vw,36px)}
.card p{margin:0;color:var(--muted);font-size:15px}
.card ul{margin:0;padding-left:18px;color:var(--muted);font-size:15px;display:grid;gap:6px}
.card-top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.kind{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pill{font-family:var(--f-mono);font-size:11px;padding:4px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.06em}
.pill.ship{color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}
.pill.now{color:var(--ink);background:var(--amber)}
.pill.now::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.chip{font-family:var(--f-mono);font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
.focus{display:grid;gap:10px;align-content:start}
.focus div{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:color-mix(in srgb,var(--ink) 60%,transparent)}
.focus b{display:block;font-size:15px;margin-bottom:2px}
.focus span{color:var(--muted);font-size:14px}
.card-slot{grid-column:span 3;display:flex;min-width:0}
.card-slot > .card{flex:1}
@media (max-width:820px){.card.feature{grid-template-columns:1fr}}
@media (max-width:640px){.card,.card-slot{grid-column:span 6}}

/* Velocity marquee */
.marquee{overflow:hidden;border-block:1px solid var(--line);padding-block:20px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.marquee + .marquee{border-top:0}
.track{display:flex;width:max-content;font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4vw,44px);white-space:nowrap;will-change:transform}
.track span{padding-right:40px}
.track.out{color:transparent;-webkit-text-stroke:1px var(--muted)}
.track span::after{content:"✦";margin-left:40px;color:var(--cyan);font-size:.5em;vertical-align:middle;-webkit-text-stroke:0}

.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px 40px;margin-top:48px}
.skill h4{font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--cyan);margin:0 0 10px;letter-spacing:.04em}
.skill p{margin:0;color:var(--muted);font-size:15px}

/* ScrollReveal */
.reveal{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4.2vw,48px);line-height:1.18;letter-spacing:-.015em;max-width:24ch;margin:0;text-wrap:pretty}
.reveal span{transition:opacity .2s linear}
.reveal .hl{color:var(--cyan)}

/* timeline */
.tl{display:grid;border-left:1px solid var(--line);margin-left:6px}
.tl-item{position:relative;padding:0 0 44px 32px;display:grid;grid-template-columns:200px 1fr;gap:24px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-6px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--ink);border:2px solid var(--cyan)}
.tl-item.edu::before{border-color:var(--amber)}
.when{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-item h3{margin:0;font-family:var(--f-display);font-size:22px;font-weight:700}
.where{color:var(--muted);margin:2px 0 12px;font-size:15px}
.tl-item ul{margin:0;padding-left:18px;color:var(--muted);display:grid;gap:6px;max-width:66ch}
.tl-item > div{min-width:0}
@media (max-width:720px){.tl-item{grid-template-columns:1fr;gap:6px}}

/* learning */
.learn{display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:40px}
.learn > *{min-width:0}
.learn h2{font-family:var(--f-display);font-size:clamp(28px,4vw,40px);line-height:1.1;margin:10px 0 14px}
.learn p{color:var(--muted);margin:0 0 22px;max-width:52ch}
@media (max-width:820px){.learn{grid-template-columns:1fr;padding:28px}}
.roadmap{display:grid;gap:10px;font-family:var(--f-mono);font-size:14px}
.rm{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;flex-wrap:wrap}
.rm em{font-style:normal;font-size:12px}

/* contact */
.contact h2{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,8vw,88px);line-height:1;letter-spacing:-.03em;margin:12px 0 28px;text-wrap:balance}
.grad{background:linear-gradient(90deg,var(--cyan),var(--amber),var(--cyan));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradmove 6s linear infinite}
@keyframes gradmove{to{background-position:-200% 0}}
.mailrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:36px}
.mail{font-family:var(--f-mono);font-size:clamp(15px,2.4vw,20px);padding:12px 18px;border:1px solid var(--line);border-radius:12px;user-select:all;overflow-wrap:anywhere}

/* Dock */
.dock{display:inline-flex;align-items:flex-end;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:22px;background:var(--panel);height:82px}
.dock a{position:relative;width:52px;height:52px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;text-decoration:none;transform-origin:bottom center;transition:transform .15s ease-out}
.dock a svg{width:22px;height:22px;stroke:var(--fg);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

        if (grab > 0.02) {
          const dx = mouse.x - n.x, dy = mouse.y - n.y, d = Math.hypot(dx, dy);
          if (d < GRAB && d > 30) { n.x += dx * 0.004 * grab; n.y += dy * 0.004 * grab; }
        }
      }
      draw();
    }
    // sparks
    ctx.clearRect(0, 0, W, H);
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i], p = (now - s.t) / 450;
      if (p >= 1) { sparks.splice(i, 1); continue; }
      const e = 1 - Math.pow(1 - p, 3), d = e * 28, len = 12 * (1 - e);
      ctx.strokeStyle = "rgba(255,181,71," + (1 - p) + ")"; ctx.lineWidth = 2; ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(s.x + Math.cos(s.a) * d, s.y + Math.sin(s.a) * d);
      ctx.lineTo(s.x + Math.cos(s.a) * (d + len), s.y + Math.sin(s.a) * (d + len));
      ctx.stroke();
    }
    requestAnimationFrame(loop);
  };
  draw();
  requestAnimationFrame(loop);
})();

// Aurora
function Aurora({ colors = ["#5EE6FF", "#3B5BFF", "#FFB547"] }) {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current, ctx = c.getContext("2d");
    let raf, t = 0;
    const size = () => { const r = c.getBoundingClientRect(); c.width = r.width / 2; c.height = r.height / 2; };
    size(); addEventListener("resize", size);
    const blobs = colors.map((col, i) => ({ col, a: i * 2.1, s: 0.0035 + i * 0.0012 }));
    const draw = () => {
      ctx.clearRect(0, 0, c.width, c.height);
      ctx.globalCompositeOperation = "lighter";
      blobs.forEach((b) => {
        const x = c.width * (0.5 + 0.38 * Math.sin(t * b.s * 6 + b.a));
        const y = c.height * (0.18 + 0.12 * Math.cos(t * b.s * 4 + b.a));
        const r = Math.max(c.width, c.height) * 0.55;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, b.col + "55"); g.addColorStop(1, b.col + "00");
        ctx.fillStyle = g; ctx.fillRect(0, 0, c.width, c.height);
      });
      t += 1; if (!reduce) raf = requestAnimationFrame(draw);
    };
    draw();
    return () => { cancelAnimationFrame(raf); removeEventListener("resize", size); };
  }, []);
  return html`<canvas ref=${ref} aria-hidden="true"></canvas>`;
}

// DecryptedText
function DecryptedText({ words, speed = 38 }) {
  const [out, setOut] = useState(words[0]);
  useEffect(() => {
    if (reduce) return;
    const chars = "!<>-_\\/[]{}=+*^?#01";
    let wi = 0, frame = 0, iv, hold;
    const run = () => {
      const target = words[wi]; frame = 0;
      iv = setInterval(() => {
        frame++;
        const revealed = Math.floor(frame / 2);
        setOut(target.split("").map((ch, i) => i < revealed || ch === " " ? ch : chars[Math.floor(Math.random() * chars.length)]).join(""));
        if (revealed >= target.length) { clearInterval(iv); hold = setTimeout(() => { wi = (wi + 1) % words.length; run(); }, 2600); }
      }, speed);
    };
    hold = setTimeout(run, 1200);
    return () => { clearInterval(iv); clearTimeout(hold); };
  }, []);
  return html`<span>${out}</span>`;
}

// CountUp
function CountUp({ to, suffix = "", duration = 1400 }) {
  const [v, setV] = useState(reduce ? to : 0);
  useEffect(() => {
    if (reduce) return;
    let start, raf;
    const step = (ts) => { if (start == null) start = ts; const p = Math.min((ts - start) / duration, 1); setV(Math.round(to * (1 - Math.pow(1 - p, 3)))); if (p < 1) raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [to]);
  return html`<b>${v}${suffix}</b>`;
}

// AnimatedContent — reveals on scroll, but only if it starts below the fold
function AnimatedContent({ children, delay = 0, as = "div", className = "" }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (reduce || !("IntersectionObserver" in window)) return;
    if (el.getBoundingClientRect().top < innerHeight) return;
    el.classList.add("pre");
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setTimeout(() => el.classList.remove("pre"), delay); io.disconnect(); } }, { threshold: 0.12 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return React.createElement(as, { ref, className: "ac " + className }, children);
}

// TiltedCard + SpotlightCard
function TiltCard({ className = "", children }) {

// ScrollVelocity
function VelocityMarquee({ items, base = 0.6, reverse = false, outline = false }) {
  const track = useRef(null);
  useEffect(() => {
    if (reduce) return;
    let x = 0, last = scrollY, v = 0, raf;
    const loop = () => {
      const dy = scrollY - last; last = scrollY;
      v += (dy - v) * 0.12;
      const dir = reverse ? -1 : 1;
      x -= dir * (base + v * 0.25);
      const half = track.current.scrollWidth / 2;
      if (x <= -half) x += half; if (x > 0) x -= half;
      track.current.style.transform = `translate3d(${x}px,0,0)`;
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, []);
  const row = [...items, ...items, ...items, ...items];
  return html`<div class="marquee" aria-hidden="true"><div ref=${track} class=${"track" + (outline ? " out" : "")}>${row.map((s, i) => html`<span key=${i}>${s}</span>`)}</div></div>`;
}

// ScrollReveal
function ScrollReveal({ text, highlight = [] }) {
  const ref = useRef(null);
  const [p, setP] = useState(reduce ? 1 : 0);
  useScroll(() => {
    if (reduce || !ref.current) return;
    const r = ref.current.getBoundingClientRect();
    setP(clamp((innerHeight * 0.85 - r.top) / (r.height + innerHeight * 0.35), 0, 1));
  });
  const words = text.split(" ");
  const n = words.length;
  return html`<p class="reveal" ref=${ref}>${words.map((w, i) => {
    const o = clamp(p * n * 1.15 - i, 0.18, 1);
    const hl = highlight.some((h) => w.toLowerCase().startsWith(h));
    return html`<span key=${i} class=${hl ? "hl" : ""} style=${{ opacity: o }}>${w} </span>`;
  })}</p>`;
}

// Dock
function Dock({ items }) {
  const ref = useRef(null);
  const move = (e) => {
    if (reduce || !finePointer) return;
    [...ref.current.children].forEach((a) => {

  const leave = () => [...ref.current.children].forEach((a) => (a.style.transform = ""));
  return html`<nav class="dock" ref=${ref} onMouseMove=${move} onMouseLeave=${leave} aria-label="Profiles">

function mdToHtml(src) {

    let lines = b.split("\n"), head = "";

    if (lines.length >= 2 && /^\s*\|/.test(lines[0]) && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(lines[1])) {
      const al = cells(lines[1]).map((c) => (/^:-+:$/.test(c) ? "center" : /-:$/.test(c) ? "right" : ""));
      const td = (tag, c, i) => "<" + tag + (al[i] ? ' style="text-align:' + al[i] + '"' : "") + ">" + inline(c) + "</" + tag + ">";
      const hd = cells(lines[0]), body = lines.slice(2).filter((l) => l.trim());

        body.map((l) => { const r = cells(l); return "<tr>" + hd.map((_, i) => td("td", r[i] || "", i)).join("") + "</tr>"; }).join("") + "</tbody></table></div>";
    }
    if (lines.every((l) => /^\s*[-*] /.test(l))) return "<ul>" + lines.map((l) => "<li>" + inline(l.replace(/^\s*[-*] /, "")) + "</li>").join("") + "</ul>";
    if (lines.every((l) => /^\s*\d+\. /.test(l))) return "<ol>" + lines.map((l) => "<li>" + inline(l.replace(/^\s*\d+\. /, "")) + "</li>").join("") + "</ol>";
    // plain lines; runs of 2+ tab-separated lines (pasted from Notion, Docs, ChatGPT) become a table
    const out = []; let buf = [], tab = [];
    const flushP = () => { if (buf.length) { out.push("<p>" + buf.map(inline).join("<br>") + "</p>"); buf = []; } };
    const flushT = () => {
      if (tab.length >= 2) {
        const rows = tab.map((l) => l.split(/\t+/).map((c) => c.trim()));
        const n = Math.max(...rows.map((r) => r.length));
        const row = (r, tag) => "<tr>" + Array.from({ length: n }, (_, i) => "<" + tag + ">" + inline(r[i] || "") + "</" + tag + ">").join("") + "</tr>";
        out.push('<div class="tbl"><table><thead>' + row(rows[0], "th") + "</thead><tbody>" + rows.slice(1).map((r) => row(r, "td")).join("") + "</tbody></table></div>");
      } else buf.push(...tab);

    };
    for (const l of lines) { if (l.includes("\t") && l.trim()) { flushP(); tab.push(l); } else { flushT(); buf.push(l); } }
    flushT(); flushP();
    return out.join("");
    })();
  }).join("");

    ? "<pre><code>" + esc(part.replace(/^[\w-]*\n/, "").replace(/\n$/, "")) + "</code></pre>"

}

// Page source for self-publishing: everything between the page markers, captured before React renders.
const SKELETON_HEAD = '<meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</st'+'yle>';
let PAGE_SOURCE = null;
function capturePage() {
  let on = false, out = "", done = false;
  const escT = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  for (const n of document.body.childNodes) {
    if (n.nodeType === 8 && n.data.trim() === "page-start") { on = true; out += "<!-" + "-page-start-->"; continue; }
    if (n.nodeType === 8 && n.data.trim() === "page-end") { out += "<!-" + "-page-end-->"; done = true; break; }
    if (!on) continue;
    if (n.nodeType === 1) out += n.outerHTML;
    else if (n.nodeType === 3) out += escT(n.textContent);
  }
  if (!done) return;
  PAGE_SOURCE = out.replace(/<canvas([^>]*?) width="\d+" height="\d+"/g, "<canvas$1");
}
function buildDoc(posts) {
  if (!PAGE_SOURCE) throw { code: "no_source" };
  const open = '<script type="application/json" id="posts-data">';
  const a = PAGE_SOURCE.indexOf(open), b = PAGE_SOURCE.indexOf("</" + "script>", a);
  if (a < 0 || b < 0) throw { code: "no_source" };
  const json = JSON.stringify(posts).replace(/</g, "\\u003c");

  return "<!doctype html><html><head>" + SKELETON_HEAD + "</" + "head><" + "body>" + PAGE_SOURCE.slice(0, a) + open + json + PAGE_SOURCE.slice(b) + "</" + "body></" + "html>";
}

async function gh(path, opts = {}, cfg = ghCfg()) {
  const r = await fetch("https://api.github.com" + path, { ...opts, cache: "no-store", headers: { Accept: "application/vnd.github+json", Authorization: "Bearer " + cfg.token, ...(opts.body ? { "Content-Type": "application/json" } : {}) } });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw { code: r.status, message: e.message || r.statusText }; }
  return r.json();
}
const b64e = (str) => { const bytes = new TextEncoder().encode(str); let bin = ""; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); };
const b64d = (b) => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g, "")), (c) => c.charCodeAt(0)));
async function ghLoad(cfg = ghCfg()) {
  try {
    const j = await gh(`/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}?ref=${encodeURIComponent(cfg.branch)}`, {}, cfg);
    const posts = JSON.parse(b64d(j.content || "W10="));
    return { posts: Array.isArray(posts) ? posts : [], sha: j.sha };
  } catch (e) { if (e.code === 404) return { posts: [], sha: null }; throw e; }
}
async function ghSave(posts, sha, message, cfg = ghCfg()) {
  const body = { message, content: b64e(JSON.stringify(posts, null, 2) + "\n"), branch: cfg.branch };
  if (sha) body.sha = sha;
  const j = await gh(`/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`, { method: "PUT", body: JSON.stringify(body) }, cfg);
  return j.content.sha;
}
function ghErr(e) {
  const c = e && e.code;
  if (c === 401) return "GitHub didn't accept the token. Check it's copied fully and hasn't expired.";
  if (c === 403) return "GitHub blocked the save" + (e.message ? " (" + e.message + ")" : "") + ". Edit the token: Repository access must include this repo, and Contents must be Read and write, not Read-only.";
  if (c === 404) return "Repo not found. Check the username and repo name, and that the token can access it.";
  return "GitHub error: " + ((e && e.message) || "network problem") + ". Try again.";
}
async function loadRemotePosts() {
  if (IS_ARTIFACT) return;
  if (ghCfg()) { try { const r = await ghLoad(); ghSha = r.sha; setPosts(r.posts); return; } catch (e) {} }
  try { const r = await fetch("posts.json", { cache: "no-store" }); if (r.ok) { const j = await r.json(); if (Array.isArray(j)) setPosts(j); } } catch (e) {}
}

const BLANK = { id: "", title: "", tag: "", status: "in-progress", period: "", summary: "", tech: "", points: "", body: "", cover: "", date: "" };
const toForm = (p) => ({ ...BLANK, ...p, tech: (p.tech || []).join(", "), points: (p.points || []).join("\n") });
function fromForm(f) {

}

const IMG_EXT = { "image/png": "png", "image/jpeg": "jpg", "image/gif": "gif", "image/webp": "webp" };
const blobToDataURL = (b) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
async function shrinkImage(file, maxW) {
  const ext = IMG_EXT[file.type] || "png";
  if (file.type === "image/gif" || file.size < 300000) return { blob: file, ext };
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const sc = Math.min(1, maxW / img.naturalWidth);
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
    const x = c.getContext("2d"); x.fillStyle = "#ffffff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise((res) => c.toBlob(res, "image/jpeg", 0.85));
    return blob ? { blob, ext: "jpg" } : { blob: file, ext };
  } finally { URL.revokeObjectURL(url); }
}
const makeTable = (r, c) => {
  const head = "| " + Array.from({ length: c }, (_, i) => "Column " + (i + 1)).join(" | ") + " |";
  const sep = "| " + Array(c).fill("---").join(" | ") + " |";
  const row = "| " + Array(c).fill("    ").join(" | ") + " |";
  return [head, sep, ...Array(r).fill(row)].join("\n");
};

  return html`<button id="copy-email" class="btn primary" onClick=${copy}>${done ? "Copied" : "Copy email"}</button>`;

function useRoute() {
  const get = () => {
    const h = location.hash.slice(1);
    if (h === "blogs") return { v: "blogs" };
    if (h === "admin") return { v: "admin" };
    const m = h.match(/^blog-([a-z0-9-]+)$/);
    if (m) return { v: "post", id: m[1] };
    return { v: "home", anchor: h };
  };
  const [r, setR] = useState(get);
  useEffect(() => { const f = () => setR(get()); addEventListener("hashchange", f); return () => removeEventListener("hashchange", f); }, []);
  return r;
}

let ownerCheck = null;
function checkOwner() {
  if (!ownerCheck) ownerCheck = (async () => {
    if (!window.claude || !window.claude.use) return false;
    const [u, a] = await Promise.all([claude.use("user"), claude.use("artifact")]);
    if (!u || !a) return false;
    return !!(await u.canEdit());
  })().catch(() => false);
  return ownerCheck;
}
function useOwner() {
  const [s, setS] = useState(null);
  useEffect(() => {
    const t = setTimeout(() => setS((v) => (v === null ? false : v)), 11000);
    checkOwner().then((v) => { clearTimeout(t); setS(v); });
    return () => clearTimeout(t);
  }, []);
  return s;
}

function App() {
  const r = useRoute();
  const owner = useOwner();
  useEffect(() => {
    if (r.v === "home" && r.anchor) { const el = document.getElementById(r.anchor); if (el) requestAnimationFrame(() => el.scrollIntoView()); }
    else if (r.v !== "home") scrollTo(0, 0);
  }, [r.v, r.id, r.anchor]);
  let page;
  if (r.v === "blogs") page = html`<${BlogList} owner=${owner} />`;
  else if (r.v === "post") page = html`<${BlogDetail} id=${r.id} owner=${owner} />`;
  else if (r.v === "admin") page = html`<${AdminPanel} owner=${owner} />`;
  else page = html`<${Home} />`;
  return html`
  <${CardNav} />
  ${page}
  <footer><div class="wrap"><span>© 2026 Rahul Jaiswal</span><span>${(owner || (!IS_ARTIFACT && ghCfg())) && r.v !== "admin" ? html`<a href="#admin">Admin panel</a> · ` : ""}</span></div></footer>
  `;
}
