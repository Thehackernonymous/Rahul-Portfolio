<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<!--page-start-->
<title>Rahul Jaiswal Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: floating CardNav, aurora hero + terminal, stats, scroll-expanding "currently building" stage, tilt/spotlight work grid, velocity marquees, scroll-reveal about, timeline, dock contact */
:root{
  --ink:#080B12;
  --panel:#0F1420;
  --panel-2:#141B2A;
  --line:#1E2638;
  --fg:#E8ECF4;
  --muted:#8A94AB;
  --cyan:#5EE6FF;
  --amber:#FFB547;
  --ok:#5BE39A;
  --c-cyan:#0D2730;
  --c-amber:#2A2113;
  --c-violet:#1E1A33;
  --violet:#A99BFF;
  --rose:#FF8FC0;
  --f-display:"Syne","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;overflow-x:hidden}
a{color:inherit}
::selection{background:var(--cyan);color:var(--ink)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- overlay (swarm cursor + click spark) ---------- */
#net{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#root{position:relative;z-index:1}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}

/* ---------- CardNav ---------- */
.cn-wrap{position:absolute;z-index:30;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 14px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.cardnav{pointer-events:auto;max-width:920px;margin:0 auto;background:color-mix(in srgb,var(--panel) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:height .45s cubic-bezier(.2,.8,.2,1);box-shadow:0 20px 50px -25px rgba(0,0,0,.9)}
.cn-top{height:58px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px 0 12px}
.hamb{width:40px;height:40px;border:0;background:none;cursor:pointer;display:grid;place-content:center;gap:6px;padding:0}
.hamb span{display:block;width:22px;height:2px;background:var(--fg);border-radius:2px;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.open .hamb span:first-child{transform:translateY(4px) rotate(45deg)}
.open .hamb span:last-child{transform:translateY(-4px) rotate(-45deg)}
.logo{font-family:var(--f-mono);font-size:14px;text-decoration:none;justify-self:center}
.logo b{color:var(--cyan);font-weight:500}
.cn-cta{justify-self:end;padding:9px 16px;font-size:14px}
.cn-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:4px 8px 8px}
.cn-card{border-radius:12px;padding:16px 16px 18px;min-height:150px;display:flex;flex-direction:column;gap:6px;opacity:0;transform:translateY(16px);transition:opacity .35s, transform .45s cubic-bezier(.2,.8,.2,1)}
.open .cn-card{opacity:1;transform:none}
.open .cn-card:nth-child(2){transition-delay:.06s}
.open .cn-card:nth-child(3){transition-delay:.12s}
.open .cn-card:nth-child(4){transition-delay:.18s}
@media (max-width:860px){.cn-cards{grid-template-columns:repeat(2,1fr)}}
.cn-card h5{font-family:var(--f-display);font-size:20px;margin:0 0 auto;font-weight:700}
.cn-card a{text-decoration:none;font-size:15px;color:var(--muted);display:flex;align-items:baseline;gap:6px;transition:color .2s}
.cn-card a:hover{color:var(--fg)}
.cn-card a::before{content:"↗";font-size:12px}
@media (max-width:640px){.cn-cards{grid-template-columns:1fr}.cn-card{min-height:0}.cn-card h5{margin-bottom:6px}.cn-cta{display:none}.cn-top{grid-template-columns:auto 1fr auto}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;font-family:inherit;transition:border-color .2s,transform .25s cubic-bezier(.2,.8,.2,1)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--cyan);color:var(--ink);border-color:var(--cyan)}
/* StarBorder */
.star{position:relative;display:inline-flex;border-radius:999px;padding:1px;overflow:hidden;text-decoration:none}
.star::before,.star::after{content:"";position:absolute;width:300%;height:50%;border-radius:50%;opacity:.9;background:radial-gradient(circle,var(--cyan),transparent 12%)}
.star::before{bottom:-12px;right:-250%;animation:starB 5s linear infinite alternate}
.star::after{top:-12px;left:-250%;animation:starT 5s linear infinite alternate}
@keyframes starB{to{transform:translateX(-100%)}}
@keyframes starT{to{transform:translateX(100%)}}
.star span{position:relative;z-index:1;display:inline-flex;gap:8px;align-items:center;padding:12px 22px;border-radius:999px;background:linear-gradient(180deg,var(--panel-2),var(--ink));border:1px solid var(--line);font-weight:600;font-size:15px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.6}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 70%,color-mix(in srgb,var(--ink) 60%,transparent));pointer-events:none}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.25fr 1fr;gap:48px;align-items:center;padding-block:140px 88px}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr;padding-block:110px 64px}}
.hero-text{min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 22%,transparent);flex:none}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(44px,11vw,92px);line-height:.95;letter-spacing:-.03em;margin:18px 0;text-wrap:balance}
.split{display:inline-block;white-space:nowrap}
@media (min-width:901px){h1{font-size:clamp(44px,7.4vw,92px)}}
.split span{display:inline-block;animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:translateY(40%);opacity:0;filter:blur(6px)}to{transform:none;opacity:1;filter:none}}
.role{font-family:var(--f-mono);font-size:clamp(15px,2vw,18px);color:var(--cyan);min-height:1.6em}
.lede{max-width:56ch;color:var(--muted);font-size:17px;margin:18px 0 30px}
.shiny{background:linear-gradient(110deg,var(--fg) 35%,#fff 50%,var(--fg) 65%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite;font-weight:600}
@keyframes shine{from{background-position:100% 0}to{background-position:-100% 0}}
.cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* terminal */
.term{min-width:0;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:14px;font-family:var(--f-mono);font-size:13px;box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
.term-bar{display:flex;gap:7px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.term-bar i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.term-bar span{margin-left:8px;color:var(--muted);font-size:12px}
.term-body{padding:16px 18px 20px;overflow-x:auto;line-height:1.75}
.term-body .p{color:var(--cyan)}
.term-body .c{color:var(--muted)}
.term-body table{border-collapse:collapse;white-space:nowrap}
.term-body td{padding-right:22px}
.done-t{color:var(--ok)}
.now-t{color:var(--amber)}
.cursor{display:inline-block;width:8px;height:15px;background:var(--cyan);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(var(--n,4),1fr);border-bottom:1px solid var(--line)}
.stat{padding:28px 20px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--f-display);font-size:clamp(34px,5vw,48px);line-height:1;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:8px;color:var(--muted);font-size:14px}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}}

/* ---------- ScrollExpand stage ---------- */
.xp{position:relative;height:230vh}
.xp-sticky{position:sticky;top:0;height:100vh;height:100svh;display:grid;place-items:center;overflow:hidden}
.xp-box{position:relative;width:min(1100px,calc(100% - 32px));height:min(76svh,640px);border-radius:20px;background:var(--panel);border:1px solid var(--line);overflow:hidden;will-change:clip-path}
.xp-dim{position:absolute;inset:0;background:var(--ink);pointer-events:none}
.xp-title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;pointer-events:none;z-index:2;font-family:var(--f-display);font-weight:800;font-size:clamp(44px,10vw,128px);line-height:.9;letter-spacing:-.03em;text-shadow:0 10px 40px rgba(0,0,0,.6)}
.xp-title span:last-child{color:var(--amber)}
.xp-cap{position:absolute;left:0;right:0;bottom:calc(50% - min(38svh,320px) - 44px);text-align:center;font-family:var(--f-mono);font-size:13px;color:var(--muted);padding:0 16px}
/* mock CAF */
.mock{position:absolute;inset:0;display:grid;grid-template-columns:220px 1fr 300px;font-size:14px}
.mock-side{border-right:1px solid var(--line);padding:20px 16px;display:grid;align-content:start;gap:4px;background:var(--panel-2)}
.mock-side h6{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:500}
.step{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--muted)}
.step i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:10px;flex:none}
.step.ok i{background:var(--ok);border-color:var(--ok);color:var(--ink)}
.step.cur{background:var(--c-amber);color:var(--fg)}
.step.cur i{border-color:var(--amber)}
.mock-main{padding:24px 28px;display:grid;align-content:start;gap:18px;min-width:0}
.mock-main h4{font-family:var(--f-display);font-size:24px;margin:0}
.prog{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.prog b{display:block;height:100%;width:62%;background:linear-gradient(90deg,var(--cyan),var(--amber))}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.field div{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--ink);padding:0 12px;display:flex;align-items:center;font-family:var(--f-mono);font-size:13px}
.field.err div{border-color:var(--amber)}
.field small{display:block;color:var(--amber);font-size:12px;margin-top:4px}
.mock-log{border-left:1px solid var(--line);padding:20px 18px;font-family:var(--f-mono);font-size:12px;display:grid;align-content:start;gap:10px;background:var(--panel-2)}
.mock-log h6{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;font-weight:500}
.mock-log p{margin:0;color:var(--muted);line-height:1.55}
.mock-log p b{color:var(--fg);font-weight:500}
.xp-table{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px}
.xr{display:grid;grid-template-columns:2fr 1fr 1.2fr;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.xr.xh{border-top:0;background:var(--panel-2);color:var(--muted);font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.tagnote{position:absolute;right:14px;bottom:12px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
@media (max-width:900px){.mock{grid-template-columns:1fr}.mock-side,.mock-log{display:none}.fields{grid-template-columns:1fr}}

/* ---------- sections ---------- */
section{padding-block:96px}
@media (max-width:640px){section{padding-block:64px}}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:40px}
.sec-head h2{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,5vw,52px);line-height:1.05;letter-spacing:-.02em;margin:8px 0 0;text-wrap:balance}
.sec-head p{max-width:42ch;color:var(--muted);margin:0}
.tag{font-family:var(--f-mono);font-size:13px;color:var(--amber)}

/* AnimatedContent: only elements that start below the fold get the pre state */
.ac{transition:opacity .9s cubic-bezier(.2,.8,.2,1),transform .9s cubic-bezier(.2,.8,.2,1)}
.ac.pre{opacity:0;transform:translateY(56px) scale(.97)}

/* Tilted + Spotlight cards */
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;perspective:1200px}
.card{grid-column:span 3;position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;min-width:0;display:flex;flex-direction:column;gap:14px;--x:50%;--y:50%;--rx:0deg;--ry:0deg;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .5s cubic-bezier(.2,.8,.2,1),border-color .3s}
.card.tilting{transition:transform .08s linear,border-color .3s}
.card:hover{border-color:color-mix(in srgb,var(--cyan) 35%,var(--line))}
.card.feature{grid-column:span 6;display:grid;grid-template-columns:1.1fr 1fr;gap:32px;padding:34px;background:linear-gradient(135deg,var(--c-amber),var(--panel) 55%)}
.card.feature > div{display:flex;flex-direction:column;gap:14px;min-width:0}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(420px circle at var(--x) var(--y),color-mix(in srgb,var(--cyan) 14%,transparent),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover::before{opacity:1}
.card h3{font-family:var(--f-display);font-size:22px;line-height:1.2;margin:0;font-weight:700}
.card.feature h3{font-size:clamp(26px,3.5vw,36px)}
.card p{margin:0;color:var(--muted);font-size:15px}
.card ul{margin:0;padding-left:18px;color:var(--muted);font-size:15px;display:grid;gap:6px}
.card-top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.kind{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pill{font-family:var(--f-mono);font-size:11px;padding:4px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.06em}
.pill.ship{color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}
.pill.now{color:var(--ink);background:var(--amber)}
.pill.now::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.chip{font-family:var(--f-mono);font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
.focus{display:grid;gap:10px;align-content:start}
.focus div{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:color-mix(in srgb,var(--ink) 60%,transparent)}
.focus b{display:block;font-size:15px;margin-bottom:2px}
.focus span{color:var(--muted);font-size:14px}
.card-slot{grid-column:span 3;display:flex;min-width:0}
.card-slot > .card{flex:1}
@media (max-width:820px){.card.feature{grid-template-columns:1fr}}
@media (max-width:640px){.card,.card-slot{grid-column:span 6}}

/* Velocity marquee */
.marquee{overflow:hidden;border-block:1px solid var(--line);padding-block:20px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.marquee + .marquee{border-top:0}
.track{display:flex;width:max-content;font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4vw,44px);white-space:nowrap;will-change:transform}
.track span{padding-right:40px}
.track.out{color:transparent;-webkit-text-stroke:1px var(--muted)}
.track span::after{content:"✦";margin-left:40px;color:var(--cyan);font-size:.5em;vertical-align:middle;-webkit-text-stroke:0}

.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px 40px;margin-top:48px}
.skill h4{font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--cyan);margin:0 0 10px;letter-spacing:.04em}
.skill p{margin:0;color:var(--muted);font-size:15px}

/* ScrollReveal */
.reveal{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4.2vw,48px);line-height:1.18;letter-spacing:-.015em;max-width:24ch;margin:0;text-wrap:pretty}
.reveal span{transition:opacity .2s linear}
.reveal .hl{color:var(--cyan)}

/* timeline */
.tl{display:grid;border-left:1px solid var(--line);margin-left:6px}
.tl-item{position:relative;padding:0 0 44px 32px;display:grid;grid-template-columns:200px 1fr;gap:24px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-6px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--ink);border:2px solid var(--cyan)}
.tl-item.edu::before{border-color:var(--amber)}
.when{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-item h3{margin:0;font-family:var(--f-display);font-size:22px;font-weight:700}
.where{color:var(--muted);margin:2px 0 12px;font-size:15px}
.tl-item ul{margin:0;padding-left:18px;color:var(--muted);display:grid;gap:6px;max-width:66ch}
.tl-item > div{min-width:0}
@media (max-width:720px){.tl-item{grid-template-columns:1fr;gap:6px}}

/* learning */
.learn{display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:40px}
.learn > *{min-width:0}
.learn h2{font-family:var(--f-display);font-size:clamp(28px,4vw,40px);line-height:1.1;margin:10px 0 14px}
.learn p{color:var(--muted);margin:0 0 22px;max-width:52ch}
@media (max-width:820px){.learn{grid-template-columns:1fr;padding:28px}}
.roadmap{display:grid;gap:10px;font-family:var(--f-mono);font-size:14px}
.rm{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;flex-wrap:wrap}
.rm em{font-style:normal;font-size:12px}

/* contact */
.contact h2{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,8vw,88px);line-height:1;letter-spacing:-.03em;margin:12px 0 28px;text-wrap:balance}
.grad{background:linear-gradient(90deg,var(--cyan),var(--amber),var(--cyan));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradmove 6s linear infinite}
@keyframes gradmove{to{background-position:-200% 0}}
.mailrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:36px}
.mail{font-family:var(--f-mono);font-size:clamp(15px,2.4vw,20px);padding:12px 18px;border:1px solid var(--line);border-radius:12px;user-select:all;overflow-wrap:anywhere}

/* Dock */
.dock{display:flex;align-items:flex-end;justify-content:space-evenly;gap:12px;width:50%;max-width:180px;padding:10px 14px;border:1px solid var(--line);border-radius:22px;background:var(--panel);height:82px}
.dock a{position:relative;width:52px;height:52px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;text-decoration:none;transform-origin:bottom center;transition:transform .15s ease-out}
.dock a svg{width:22px;height:22px;stroke:var(--fg);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dock a em{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);font-style:normal;font-family:var(--f-mono);font-size:11px;white-space:nowrap;background:var(--panel-2);border:1px solid var(--line);padding:3px 8px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none}
.dock a:hover em,.dock a:focus-visible em{opacity:1}
@media (hover:hover) and (pointer:fine) and (prefers-reduced-motion:no-preference){.dock a:hover{transform:scale(1.55)}}
footer{border-top:1px solid var(--line);padding-block:28px;color:var(--muted);font-size:13px;font-family:var(--f-mono)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* contact form */
.contact-grid{display:grid;grid-template-columns:1fr 1.15fr;gap:40px;align-items:start}
.contact-grid > *{min-width:0}
@media (max-width:860px){.contact-grid{grid-template-columns:1fr}}
.contact-side p{color:var(--muted);max-width:44ch;margin:0 0 24px;font-size:17px}
.addr{display:grid;gap:4px;margin-bottom:28px}
.addr span{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.addr .mail{padding:0;border:0;font-weight:500}
.cform{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;display:grid;gap:16px}
.cform h3{font-family:var(--f-display);font-size:24px;margin:0}
.frow{display:flex;gap:14px;flex-wrap:wrap}
.frow > .fld{flex:1;min-width:180px}
.fld{display:grid;gap:6px;min-width:0}
.fld label{font-size:13px;color:var(--muted);font-weight:500}
.fld input,.fld textarea{width:100%;font:inherit;font-size:15px;color:var(--fg);background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 13px;resize:vertical;transition:border-color .2s}
.fld input::placeholder,.fld textarea::placeholder{color:color-mix(in srgb,var(--muted) 65%,transparent)}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--cyan)}
.fld input[aria-invalid="true"],.fld textarea[aria-invalid="true"]{border-color:var(--amber)}
.ferr{color:var(--amber);font-size:13px}
.fsend{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fnote{margin:0;color:var(--muted);font-size:13px}
.fnote.sent{color:var(--ok)}
.fnote.error{color:var(--amber)}
.btn.danger{border-color:#ff6b6b;color:#ff8a8a}
/* pages */
.page{padding-block:120px 80px;min-height:70vh}
.page-title{font-family:var(--f-display);font-weight:800;font-size:clamp(36px,6vw,64px);line-height:1.02;letter-spacing:-.025em;margin:8px 0 0;text-wrap:balance}
.back{display:inline-flex;font-family:var(--f-mono);font-size:13px;color:var(--muted);text-decoration:none;margin-bottom:22px}
.back:hover{color:var(--fg)}
.narrow{max-width:860px}
.status{color:var(--amber);font-size:14px;font-family:var(--f-mono);margin:0}
.muted-s{color:var(--muted);font-size:13px;font-family:var(--f-mono)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.tagbtn{font:inherit;font-family:var(--f-mono);font-size:13px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer}
.tagbtn.on{background:var(--fg);color:var(--ink);border-color:var(--fg)}
/* blog cards */
.bgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
@media (max-width:820px){.bgrid{grid-template-columns:1fr}}
.bcard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .25s,transform .35s cubic-bezier(.2,.8,.2,1);min-width:0}
.bcard:hover{border-color:color-mix(in srgb,var(--cyan) 40%,var(--line));transform:translateY(-4px)}
.stretch{position:absolute;inset:0;z-index:2;border-radius:inherit}
.cover{position:relative;height:190px;overflow:hidden;background:radial-gradient(120% 140% at 85% 0%,color-mix(in srgb,var(--tc) 38%,transparent),transparent 60%),linear-gradient(135deg,color-mix(in srgb,var(--tc) 22%,var(--panel)),var(--panel-2));border-bottom:1px solid var(--line)}
.cover.big{height:240px;border:1px solid var(--line);border-radius:20px;margin-bottom:28px}
.cover i{position:absolute;left:18px;top:34px;font-style:normal;font-family:var(--f-display);font-weight:800;font-size:clamp(48px,7vw,84px);letter-spacing:-.03em;color:color-mix(in srgb,var(--tc) 9%,transparent);white-space:nowrap}
.cover b{position:absolute;inset:24px 0 0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:clamp(56px,8vw,92px);letter-spacing:-.02em;color:color-mix(in srgb,var(--tc) 60%,transparent)}
.cover .pill{position:absolute;left:16px;top:16px;z-index:1}
.bbody{padding:24px 26px 26px;display:flex;flex-direction:column;gap:16px;flex:1}
.btop{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.btop h3{font-family:var(--f-display);font-size:24px;line-height:1.2;margin:0;font-weight:700;min-width:0;overflow-wrap:break-word}
.btag{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.bsum{margin:-6px 0 0;color:var(--muted);font-size:15px}
.bmeta{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.bbody h5,.takeaways h5{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--fg)}
.bbody .chips{margin:0;padding:0}
.pts{margin:0;padding-left:18px;color:var(--muted);font-size:14.5px;display:grid;gap:4px}
.pts li::marker{color:var(--amber)}
.bread{justify-content:center;margin-top:auto;width:100%}
/* detail */
.detail-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.detail-top .back{margin:0}
.dhead{display:grid;gap:14px;margin-bottom:28px}
.dhead .page-title{margin:0}
.dsum{margin:0;color:var(--muted);font-size:19px;max-width:60ch}
.takeaways{border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:12px;padding:16px 20px;margin-bottom:32px;background:var(--panel)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:48px;border-top:1px solid var(--line);padding-top:24px}
.pn a{display:grid;gap:4px;text-decoration:none;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);min-width:0}
.pn a:hover{border-color:var(--muted)}
.pn a span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pn a b{font-family:var(--f-display);font-size:17px;overflow-wrap:anywhere}
.pn .nx{text-align:right}
@media (max-width:560px){.pn{grid-template-columns:1fr}.pn .nx{text-align:left}}
/* empty */
.empty{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;border:1px dashed var(--line);border-radius:18px;padding:28px}
.empty h3{font-family:var(--f-display);font-size:24px;margin:0 0 6px}
.empty p{color:var(--muted);margin:0 0 16px;max-width:52ch}
.empty-term{font-family:var(--f-mono);font-size:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;line-height:1.8}
.empty-term .p{color:var(--cyan)} .empty-term .c{color:var(--muted)}
@media (max-width:640px){.empty{grid-template-columns:1fr}}
/* admin */
.admin-grid{display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start}
.admin-grid > *{min-width:0}
@media (max-width:900px){.admin-grid{grid-template-columns:1fr}}
.admin-list{display:grid;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;position:sticky;top:16px}
@media (max-width:900px){.admin-list{position:static}}
.alist{display:grid;gap:6px;max-height:420px;overflow:auto}
.arow{font:inherit;text-align:left;display:grid;gap:2px;padding:10px 12px;border-radius:10px;border:1px solid transparent;background:none;color:var(--fg);cursor:pointer}
.arow:hover{background:var(--panel-2)}
.arow.on{background:var(--panel-2);border-color:var(--line)}
.arow b{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.arow span{font-size:12px;color:var(--muted);font-family:var(--f-mono);display:flex;align-items:center;gap:6px}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.sdot.c{background:var(--ok)}
.admin-form{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;display:grid;gap:16px}
.aform-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.aform-head h3{font-family:var(--f-display);font-size:24px;margin:0}
.fld small{color:var(--muted);font-weight:400}
.fld select{width:100%;font:inherit;font-size:15px;color:var(--fg);background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.fld textarea.mono{font-family:var(--f-mono);font-size:13px;line-height:1.6}
.hint{color:var(--muted);font-size:12px;font-family:var(--f-mono)}
.ptabs{display:flex;gap:8px;flex-wrap:wrap}
.preview{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--ink);max-height:520px;overflow:auto;font-size:15px}
.pcard{max-width:520px}
.linkbtn{font:inherit;background:none;border:0;padding:0;color:var(--cyan);text-decoration:underline;cursor:pointer}
.btn[disabled]{opacity:.6;cursor:progress}
.conflict{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border:1px solid var(--amber);background:var(--c-amber);border-radius:12px;padding:14px 16px}
.conflict > div{display:grid;gap:2px;min-width:0;flex:1}
.conflict span{color:var(--muted);font-size:14px}
.pcard .bcard:hover{transform:none}
.prose{color:color-mix(in srgb,var(--fg) 88%,var(--muted));font-size:17px;line-height:1.75;min-width:0;max-width:100%}
.prose p,.prose li,.prose h4,.prose figcaption,.prose a,.prose code{overflow-wrap:anywhere}
.prose pre{max-width:100%}
.dhead,.dhead *{overflow-wrap:anywhere}
.bsum,.pts li{overflow-wrap:anywhere}
.prose > *{margin:0 0 1em}
.prose h4{font-family:var(--f-display);font-size:22px;color:var(--fg);margin-top:1.4em}
.prose ul,.prose ol{padding-left:22px}
.prose code{font-family:var(--f-mono);font-size:.88em;background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.prose pre{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow-x:auto}
.prose pre code{border:0;padding:0;background:none;font-size:13.5px}
.prose a{color:var(--cyan)}
.prose img{display:block;max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);background:var(--panel-2)}
.prose figure{margin:0 0 1.2em}
.prose figcaption{margin-top:8px;font-size:13px;color:var(--muted);font-family:var(--f-mono)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
.tbl table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.5}
.tbl th,.tbl td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;min-width:110px}
.tbl th{background:var(--panel-2);color:var(--fg);font-weight:600;font-size:14px}
.tbl tr:last-child td{border-bottom:0}
.tbl td code{white-space:nowrap}
.mdbar{display:flex;flex-wrap:wrap;gap:6px}
.mdbar button,.imgbtn{font:inherit;font-family:var(--f-mono);font-size:13px;line-height:1;padding:8px 11px;border-radius:8px;border:1px solid var(--line);background:var(--ink);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center}
.mdbar button:hover,.imgbtn:hover{border-color:var(--muted)}
.mdbar button.on{border-color:var(--cyan);color:var(--cyan)}
.imgbtn{position:relative;border-color:color-mix(in srgb,var(--cyan) 45%,var(--line));color:var(--cyan)}
.imgbtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.imgbtn.busy{opacity:.6;cursor:progress}
.imgbtn:focus-within{outline:2px solid var(--cyan);outline-offset:2px}
.tblpick{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--ink)}
.tblpick label{font-size:13px;color:var(--muted)}
.tblpick input{width:64px;font:inherit;font-size:14px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
.tblpick .btn{padding:8px 14px;font-size:14px}
.tblpick .hint{flex-basis:100%}
.prose .muted{color:var(--muted)}
.sig{color:var(--muted);font-size:14px;margin:12px 0 0}
.sig a{color:var(--cyan)}

/* Talk to me chat + owner inbox */
.talk{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:35;box-shadow:0 14px 40px -12px rgba(0,0,0,.85)}
.chatbox{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 76px);z-index:35;width:min(380px,calc(100vw - 32px));height:min(540px,calc(100svh - 110px));display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px -30px rgba(0,0,0,.9);overflow:hidden}
.chat-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.chat-head div{display:grid;min-width:0}
.chat-head b{font-family:var(--f-display);font-size:17px}
.chat-head span{font-size:12px;color:var(--muted)}
.chat-x{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--line);background:none;color:var(--fg);font-size:20px;line-height:1;cursor:pointer}
.chat-body{flex:1;min-height:0;display:flex;flex-direction:column}
.chat-pad{padding:16px;display:grid;gap:14px;align-content:start;overflow-y:auto}
.chat-pad p{margin:0;color:var(--muted);font-size:14px}
.chat-note{margin:0;padding:0 14px 10px;font-size:12px;color:var(--muted)}
.thread{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:82%;padding:8px 12px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);align-self:flex-start}
.bub.me{align-self:flex-end;background:var(--c-cyan);border-color:color-mix(in srgb,var(--cyan) 30%,var(--line))}
.bub p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.45}
.bub time{display:block;margin-top:2px;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.composer{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:10px;border-top:1px solid var(--line)}
.composer textarea{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--fg);background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;resize:none;max-height:120px}
.composer textarea:focus{outline:none;border-color:var(--cyan)}
.composer .btn{padding:10px 18px}
.composer .ferr{flex-basis:100%}
.inbox{display:grid;grid-template-columns:300px 1fr;height:min(70svh,640px);border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel)}
.inbox > *{min-width:0;min-height:0}
.ilist{border-right:1px solid var(--line);overflow-y:auto;display:grid;align-content:start}
.ilist > p{padding:16px;margin:0}
.irow{font:inherit;text-align:left;color:var(--fg);background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;cursor:pointer;min-width:0}
.irow:hover,.irow.on{background:var(--panel-2)}
.irow b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow.unread b::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cyan);margin-left:8px;vertical-align:middle}
.irow time{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.irow span{grid-column:1/-1;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ithread{display:flex;flex-direction:column}
.ihead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.iback{display:none}
.ipick{margin:auto;padding:24px}
@media (max-width:760px){.inbox{grid-template-columns:1fr;height:calc(100svh - 230px)}.inbox.has-sel .ilist{display:none}.inbox:not(.has-sel) .ithread{display:none}.iback{display:inline}.ilist{border-right:0}}

/* site editor (#me) */
.mehub{display:flex;flex-wrap:wrap;gap:8px;margin:-16px 0 24px}
.sfields{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.sfields > *,.sgroup > *{grid-column:1/-1;min-width:0}
.sfields > .half,.sgroup > .half{grid-column:auto}
.sgroup{border:1px solid var(--line);border-radius:14px;padding:16px;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;min-width:0}
.sgroup legend{padding:0 6px;font-weight:600;font-size:14px}
.slist{display:grid;gap:10px}
.slist-head{display:grid;gap:2px}
.slist-head b{font-size:14px}
.sitem{border:1px solid var(--line);border-radius:12px;background:var(--ink)}
.sitem summary{cursor:pointer;padding:12px 14px;font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.sitem[open] summary{border-bottom:1px solid var(--line)}
.sitem > .sfields{padding:14px}
.sitem-act{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 14px}
.sitem-act .btn,.slist > .btn{padding:7px 14px;font-size:13px}
.slist > .btn{justify-self:start}
.sitem-act .btn[disabled]{cursor:not-allowed;opacity:.4}
.scheck{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}
.scheck input{width:18px;height:18px;accent-color:var(--cyan)}
.sbar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;margin-top:20px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.sbar .status{margin-right:auto;flex:1 1 220px;color:var(--muted)}
.sbar .status.warn{color:var(--amber)}
.plinks{display:flex;flex-wrap:wrap;gap:8px 16px}
.plink{font-family:var(--f-mono);font-size:13px;color:var(--cyan);text-decoration:none;position:relative;z-index:1}
.plink:hover{text-decoration:underline}
.pvbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 84px);z-index:36;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:center;padding:10px 14px;border:1px solid var(--amber);background:var(--c-amber);border-radius:14px;font-size:14px;width:max-content;max-width:calc(100vw - 32px);box-shadow:0 14px 40px -12px rgba(0,0,0,.85)}
.pvbar .btn{padding:7px 14px;font-size:13px}
@media (max-width:640px){.sfields > .half,.sgroup > .half{grid-column:1/-1}.sgroup{padding:12px}}

<script>
const { useEffect, useRef, useState } = React;
const html = htm.bind(React.createElement);
const reduce = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
const finePointer = !!(window.matchMedia && matchMedia("(pointer: fine)").matches);

/* shared scroll subscription, rAF-throttled */
const scrollSubs = new Set();
let ticking = false;
addEventListener("scroll", () => { if (ticking) return; ticking = true; requestAnimationFrame(() => { ticking = false; scrollSubs.forEach((f) => f()); }); }, { passive: true });

// Background network (particles that link up, and link to the cursor) + ClickSpark
(function fx() {
  const net = document.getElementById("net"), nctx = net.getContext("2d");
  const c = document.getElementById("fx"), ctx = c.getContext("2d");
  const dpr = Math.min(devicePixelRatio || 1, 2);
  let W = innerWidth, H = innerHeight;
  const INTERACTIVE = "a,button,input,textarea,select,label,summary,[role=button],.dock,.chip,.mail";
  const mouse = { x: -9999, y: -9999, on: false, over: false };
  const LINK = 150, GRAB = 200, MAX = 170;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const make = (x, y) => ({ x: x ?? rnd(0, W), y: y ?? rnd(0, H), vx: rnd(-.28, .28), vy: rnd(-.28, .28), r: rnd(1, 2.6) });
  let nodes = [];
  const size = () => {
    W = innerWidth; H = innerHeight;
    for (const cv of [net, c]) { cv.width = W * dpr; cv.height = H * dpr; }
    nctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const target = Math.min(120, Math.round((W * H) / 13000));
    while (nodes.length < target) nodes.push(make());
    if (nodes.length > target) nodes.length = target;
    for (const n of nodes) { n.x = Math.min(n.x, W); n.y = Math.min(n.y, H); }
  };
  size(); addEventListener("resize", () => { size(); if (reduce) draw(); });

  addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse") return;
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.on = true;
    mouse.over = !!(e.target && e.target.closest && e.target.closest(INTERACTIVE));
  });
  document.addEventListener("mouseleave", () => (mouse.on = false));

  const sparks = [];
  addEventListener("pointerdown", (e) => {
    const t = performance.now();
    for (let i = 0; i < 10; i++) sparks.push({ x: e.clientX, y: e.clientY, a: (i / 10) * Math.PI * 2, t });
    // push a few new nodes where you click
    if (!(e.target && e.target.closest && e.target.closest(INTERACTIVE))) {
      for (let i = 0; i < 3; i++) nodes.push(make(e.clientX + rnd(-20, 20), e.clientY + rnd(-20, 20)));
      if (nodes.length > MAX) nodes.splice(0, nodes.length - MAX);
    }
  });

  let grab = 0;
  const CY = "94,230,255", BL = "120,150,255";
  function draw() {
    nctx.clearRect(0, 0, W, H);
    const N = nodes.length;
    nctx.lineWidth = 0.7;
    for (let i = 0; i < N; i++) {
      const a = nodes[i];
      for (let j = i + 1; j < N; j++) {
        const b = nodes[j], dx = a.x - b.x, dy = a.y - b.y;
        if (Math.abs(dx) > LINK || Math.abs(dy) > LINK) continue;
        const d = Math.hypot(dx, dy);
        if (d < LINK) {
          nctx.strokeStyle = `rgba(${BL},${(1 - d / LINK) * 0.28})`;
          nctx.beginPath(); nctx.moveTo(a.x, a.y); nctx.lineTo(b.x, b.y); nctx.stroke();
        }
      }
    }
    // cursor grab links
    if (grab > 0.02) {
      nctx.lineWidth = 1;
      for (const n of nodes) {
        const d = Math.hypot(n.x - mouse.x, n.y - mouse.y);
        if (d < GRAB) {
          nctx.strokeStyle = `rgba(${CY},${(1 - d / GRAB) * 0.7 * grab})`;
          nctx.beginPath(); nctx.moveTo(mouse.x, mouse.y); nctx.lineTo(n.x, n.y); nctx.stroke();
        }
      }
      nctx.fillStyle = `rgba(${CY},${0.9 * grab})`;
      nctx.beginPath(); nctx.arc(mouse.x, mouse.y, 2.4, 0, Math.PI * 2); nctx.fill();
    }
    for (const n of nodes) {
      const near = grab > 0.02 && Math.hypot(n.x - mouse.x, n.y - mouse.y) < GRAB;
      nctx.fillStyle = near ? `rgba(${CY},0.95)` : `rgba(${BL},0.6)`;
      nctx.beginPath(); nctx.arc(n.x, n.y, near ? n.r + 0.6 : n.r, 0, Math.PI * 2); nctx.fill();
    }
  }

  const loop = (now) => {
    if (!reduce) {
      grab += ((finePointer && mouse.on && !mouse.over ? 1 : 0) - grab) * 0.12;
      for (const n of nodes) {
        n.x += n.vx; n.y += n.vy;
        if (n.x < 0 || n.x > W) { n.vx *= -1; n.x = Math.max(0, Math.min(W, n.x)); }
        if (n.y < 0 || n.y > H) { n.vy *= -1; n.y = Math.max(0, Math.min(H, n.y)); }
        // nodes near the cursor lean in slightly
        if (grab > 0.02) {
          const dx = mouse.x - n.x, dy = mouse.y - n.y, d = Math.hypot(dx, dy);
          if (d < GRAB && d > 30) { n.x += dx * 0.004 * grab; n.y += dy * 0.004 * grab; }
        }
      }
      draw();
    }
    // sparks
    ctx.clearRect(0, 0, W, H);
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i], p = (now - s.t) / 450;
      if (p >= 1) { sparks.splice(i, 1); continue; }
      const e = 1 - Math.pow(1 - p, 3), d = e * 28, len = 12 * (1 - e);
      ctx.strokeStyle = "rgba(255,181,71," + (1 - p) + ")"; ctx.lineWidth = 2; ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(s.x + Math.cos(s.a) * d, s.y + Math.sin(s.a) * d);
      ctx.lineTo(s.x + Math.cos(s.a) * (d + len), s.y + Math.sin(s.a) * (d + len));
      ctx.stroke();
    }
    requestAnimationFrame(loop);
  };
  draw();
  requestAnimationFrame(loop);
})();

// Aurora
function Aurora({ colors = ["#5EE6FF", "#3B5BFF", "#FFB547"] }) {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current, ctx = c.getContext("2d");
    let raf, t = 0;
    const size = () => { const r = c.getBoundingClientRect(); c.width = r.width / 2; c.height = r.height / 2; };
    size(); addEventListener("resize", size);
    const blobs = colors.map((col, i) => ({ col, a: i * 2.1, s: 0.0035 + i * 0.0012 }));
    const draw = () => {
      ctx.clearRect(0, 0, c.width, c.height);
      ctx.globalCompositeOperation = "lighter";
      blobs.forEach((b) => {
        const x = c.width * (0.5 + 0.38 * Math.sin(t * b.s * 6 + b.a));
        const y = c.height * (0.18 + 0.12 * Math.cos(t * b.s * 4 + b.a));
        const r = Math.max(c.width, c.height) * 0.55;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, b.col + "55"); g.addColorStop(1, b.col + "00");
        ctx.fillStyle = g; ctx.fillRect(0, 0, c.width, c.height);
      });
      t += 1; if (!reduce) raf = requestAnimationFrame(draw);
    };
    draw();
    return () => { cancelAnimationFrame(raf); removeEventListener("resize", size); };
  }, []);
  return html`<canvas ref=${ref} aria-hidden="true"></canvas>`;
}

// DecryptedText
function DecryptedText({ words, speed = 38 }) {
  const [out, setOut] = useState(words[0]);
  useEffect(() => {
    if (reduce) return;
    const chars = "!<>-_\\/[]{}=+*^?#01";
    let wi = 0, frame = 0, iv, hold;
    const run = () => {
      const target = words[wi]; frame = 0;
      iv = setInterval(() => {
        frame++;
        const revealed = Math.floor(frame / 2);
        setOut(target.split("").map((ch, i) => i < revealed || ch === " " ? ch : chars[Math.floor(Math.random() * chars.length)]).join(""));
        if (revealed >= target.length) { clearInterval(iv); hold = setTimeout(() => { wi = (wi + 1) % words.length; run(); }, 2600); }
      }, speed);
    };
    hold = setTimeout(run, 1200);
    return () => { clearInterval(iv); clearTimeout(hold); };
  }, []);
  return html`<span>${out}</span>`;
}

// CountUp
function CountUp({ to, suffix = "", duration = 1400 }) {
  const [v, setV] = useState(reduce ? to : 0);
  useEffect(() => {
    if (reduce) return;
    let start, raf;
    const step = (ts) => { if (start == null) start = ts; const p = Math.min((ts - start) / duration, 1); setV(Math.round(to * (1 - Math.pow(1 - p, 3)))); if (p < 1) raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [to]);
  return html`<b>${v}${suffix}</b>`;
}

// Magnet
function Magnet({ children, strength = 0.25 }) {
  const ref = useRef(null);
  const move = (e) => { if (reduce) return; const r = ref.current.getBoundingClientRect(); ref.current.firstChild.style.transform = `translate(${(e.clientX - r.left - r.width / 2) * strength}px,${(e.clientY - r.top - r.height / 2) * strength}px)`; };
  const leave = () => { ref.current.firstChild.style.transform = ""; };
  return html`<span ref=${ref} onMouseMove=${move} onMouseLeave=${leave} style=${{ display: "inline-flex", padding: "6px", margin: "-6px" }}>${children}</span>`;
}

// AnimatedContent — reveals on scroll, but only if it starts below the fold
function AnimatedContent({ children, delay = 0, as = "div", className = "" }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (reduce || !("IntersectionObserver" in window)) return;
    if (el.getBoundingClientRect().top < innerHeight) return;
    el.classList.add("pre");
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setTimeout(() => el.classList.remove("pre"), delay); io.disconnect(); } }, { threshold: 0.12 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return React.createElement(as, { ref, className: "ac " + className }, children);
}

// TiltedCard + SpotlightCard
function TiltCard({ className = "", children }) {
  const ref = useRef(null);
  const move = (e) => {
    const el = ref.current, r = el.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    el.style.setProperty("--x", x + "px"); el.style.setProperty("--y", y + "px");
    if (reduce || !finePointer) return;
    el.classList.add("tilting");
    const amt = className.includes("feature") ? 3 : 7;
    el.style.setProperty("--ry", ((x / r.width) - 0.5) * amt + "deg");
    el.style.setProperty("--rx", (0.5 - (y / r.height)) * amt + "deg");
  };
  const leave = () => { const el = ref.current; el.classList.remove("tilting"); el.style.setProperty("--rx", "0deg"); el.style.setProperty("--ry", "0deg"); };
  return html`<article ref=${ref} class=${"card " + className} onMouseMove=${move} onMouseLeave=${leave}>${children}</article>`;
}

// ScrollExpandMedia
function ScrollExpand({ children }) {
  const ref = useRef(null);
  const [p, setP] = useState(reduce ? 1 : 0);
  useScroll(() => {
    if (reduce || !ref.current) return;
    const r = ref.current.getBoundingClientRect();
    const total = r.height - innerHeight;
    setP(clamp(-r.top / (total * 0.75), 0, 1));
  });
  const e = 1 - Math.pow(1 - p, 2);
  const ix = (1 - e) * 22, iy = (1 - e) * 18, rad = 24 - e * 4;
  return html`<div class="xp" ref=${ref} id="now">
    <div class="xp-sticky">
      <div class="xp-box" style=${{ clipPath: `inset(${iy}% ${ix}% round ${rad}px)` }}>
        ${children}
        <div class="xp-dim" style=${{ opacity: 0.55 * (1 - e) }}></div>
      </div>
      <div class="xp-title" aria-hidden=${p > 0.6}>
        <span style=${{ transform: `translateX(${-e * 70}vw)`, opacity: 1 - e }}>Currently</span>
        <span style=${{ transform: `translateX(${e * 70}vw)`, opacity: 1 - e }}>building</span>
      </div>
      <div class="xp-cap" style=${{ opacity: clamp(e * 1.4 - 0.3, 0, 1) }}>UPSC Online Recruitment Portal · Common Application Form · Angular + Keycloak</div>
    </div>
  </div>`;
}

// ScrollVelocity
function VelocityMarquee({ items, base = 0.6, reverse = false, outline = false }) {
  const track = useRef(null);
  useEffect(() => {
    if (reduce) return;
    let x = 0, last = scrollY, v = 0, raf;
    const loop = () => {
      const dy = scrollY - last; last = scrollY;
      v += (dy - v) * 0.12;
      const dir = reverse ? -1 : 1;
      x -= dir * (base + v * 0.25);
      const half = track.current.scrollWidth / 2;
      if (x <= -half) x += half; if (x > 0) x -= half;
      track.current.style.transform = `translate3d(${x}px,0,0)`;
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, []);
  const row = [...items, ...items, ...items, ...items];
  return html`<div class="marquee" aria-hidden="true"><div ref=${track} class=${"track" + (outline ? " out" : "")}>${row.map((s, i) => html`<span key=${i}>${s}</span>`)}</div></div>`;
}

// ScrollReveal
function ScrollReveal({ text, highlight = [] }) {
  const ref = useRef(null);
  const [p, setP] = useState(reduce ? 1 : 0);
  useScroll(() => {
    if (reduce || !ref.current) return;
    const r = ref.current.getBoundingClientRect();
    setP(clamp((innerHeight * 0.85 - r.top) / (r.height + innerHeight * 0.35), 0, 1));
  });
  const words = text.split(" ");
  const n = words.length;
  return html`<p class="reveal" ref=${ref}>${words.map((w, i) => {
    const o = clamp(p * n * 1.15 - i, 0.18, 1);
    const hl = highlight.some((h) => w.toLowerCase().startsWith(h));
    return html`<span key=${i} class=${hl ? "hl" : ""} style=${{ opacity: o }}>${w} </span>`;
  })}</p>`;
}

// Reserved, placeholder and throwaway-inbox domains people type to skip the email field
const FAKE_DOMAINS = new Set(["test.com", "test.in", "test.org", "testing.com", "example.com", "example.org", "example.net", "domain.com", "email.com", "abc.com", "xyz.com", "asdf.com", "fake.com", "mailinator.com", "yopmail.com", "guerrillamail.com", "sharklasers.com", "10minutemail.com", "tempmail.com", "temp-mail.org", "tempmail.dev", "trashmail.com", "getnada.com", "dispostable.com", "fakeinbox.com", "maildrop.cc", "throwawaymail.com", "mohmal.com", "emailondeck.com", "mintemail.com"]);
const FAKE_LOCAL = /^(test|testing|tester|abc|abcd|asdf|qwerty|xyz|fake|demo|sample|example|dummy|noreply|no-reply|a+|x+|1+|123+)\d*$/;
const DOMAIN_TYPOS = { "gmail.co": "gmail.com", "gmail.cm": "gmail.com", "gmail.con": "gmail.com", "gmail.in": "gmail.com", "gmial.com": "gmail.com", "gmai.com": "gmail.com", "gamil.com": "gmail.com", "gnail.com": "gmail.com", "gmaill.com": "gmail.com", "yahoo.co": "yahoo.com", "yaho.com": "yahoo.com", "yahooo.com": "yahoo.com", "hotmail.co": "hotmail.com", "hotmal.com": "hotmail.com", "outlook.co": "outlook.com", "outlok.com": "outlook.com", "iclod.com": "icloud.com", "icloud.co": "icloud.com" };
function emailProblem(email) {
  if (!/^[a-z0-9._%+-]+@[a-z0-9-]+(\.[a-z0-9-]+)*\.[a-z]{2,}$/i.test(email)) return "Enter a valid email so I can reply.";
  const [local, domain] = email.toLowerCase().split("@");
  if (DOMAIN_TYPOS[domain]) return "Did you mean " + local + "@" + DOMAIN_TYPOS[domain] + "?";
  if (FAKE_DOMAINS.has(domain) || FAKE_LOCAL.test(local)) return "Please use your real email so I can reply.";
  return "";
}
// fetch that gives up after ms, so a blocked or silent service can't leave the form stuck on "Sending…"
function fetchWithin(url, opts, ms) {
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), ms);
  return fetch(url, { ...opts, signal: ac.signal }).finally(() => clearTimeout(t));
}
// Asks public DNS whether the domain accepts mail. Returns false only when it clearly doesn't; network trouble lets the email through.
async function domainTakesMail(domain) {
  try {
    const r = await fetchWithin("https://dns.google/resolve?name=" + encodeURIComponent(domain) + "&type=MX", { headers: { Accept: "application/dns-json" } }, 4000);
    if (!r.ok) return true;
    const d = await r.json();
    if (d.Status === 3) return false;
    const mx = (d.Answer || []).filter((a) => a.type === 15);
    return mx.length > 0 && !mx.every((a) => /^\d+ \.$/.test(a.data.trim()));
  } catch (e) { return true; }
}

function ContactForm({ title }) {
  const to = (SITE.contact.email || EMAIL).trim();
  const blank = { name: "", email: "", subject: "", msg: "" };
  const [f, setF] = useState(blank);
  const [err, setErr] = useState({});
  const [status, setStatus] = useState({ s: "idle", text: "" });
  const set = (k) => (e) => { setF({ ...f, [k]: e.target.value }); setErr({ ...err, [k]: "" }); if (status.s !== "sending") setStatus({ s: "idle", text: "" }); };
  const send = async (e) => {
    e.preventDefault();
    const bad = {};
    if (!f.name.trim()) bad.name = "Tell me your name.";
    const ep = emailProblem(f.email.trim());
    if (ep) bad.email = ep;

function mdToHtml(src) {
  const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const IMG = /!\[([^\]]*)\]\(((?:https:\/\/|data:image\/(?:png|jpeg|gif|webp);base64,|images\/)[^\s)"]+)\)/g;
  const inline = (t) => esc(t)
    .replace(IMG, '<img src="$2" alt="$1" loading="lazy">')
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

    let lines = b.split("\n"), head = "";

    const isImgLine = (l) => /^!\[[^\]]*\]\([^)]+\)$/.test(l.trim());
    const cells = (l) => l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());

    if (lines.every(isImgLine)) return lines.map((l) => { const m = l.trim().match(/^!\[([^\]]*)\]/); return "<figure>" + inline(l.trim()) + (m && m[1] ? "<figcaption>" + esc(m[1]) + "</figcaption>" : "") + "</figure>"; }).join("");
    if (lines.length >= 2 && /^\s*\|/.test(lines[0]) && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(lines[1])) {
      const al = cells(lines[1]).map((c) => (/^:-+:$/.test(c) ? "center" : /-:$/.test(c) ? "right" : ""));
      const td = (tag, c, i) => "<" + tag + (al[i] ? ' style="text-align:' + al[i] + '"' : "") + ">" + inline(c) + "</" + tag + ">";
      const hd = cells(lines[0]), body = lines.slice(2).filter((l) => l.trim());
      return '<div class="tbl"><table><thead><tr>' + hd.map((c, i) => td("th", c, i)).join("") + "</tr></thead><tbody>" +
        body.map((l) => { const r = cells(l); return "<tr>" + hd.map((_, i) => td("td", r[i] || "", i)).join("") + "</tr>"; }).join("") + "</tbody></table></div>";
    }
    if (lines.every((l) => /^\s*[-*] /.test(l))) return "<ul>" + lines.map((l) => "<li>" + inline(l.replace(/^\s*[-*] /, "")) + "</li>").join("") + "</ul>";

    const out = []; let buf = [], tab = [];
    const flushP = () => { if (buf.length) { out.push("<p>" + buf.map(inline).join("<br>") + "</p>"); buf = []; } };
    const flushT = () => {
      if (tab.length >= 2) {
        const rows = tab.map((l) => l.split(/\t+/).map((c) => c.trim()));
        const n = Math.max(...rows.map((r) => r.length));
        const row = (r, tag) => "<tr>" + Array.from({ length: n }, (_, i) => "<" + tag + ">" + inline(r[i] || "") + "</" + tag + ">").join("") + "</tr>";
        out.push('<div class="tbl"><table><thead>' + row(rows[0], "th") + "</thead><tbody>" + rows.slice(1).map((r) => row(r, "td")).join("") + "</tbody></table></div>");
      } else buf.push(...tab);
      tab = [];
    };
    for (const l of lines) { if (l.includes("\t") && l.trim()) { flushP(); tab.push(l); } else { flushT(); buf.push(l); } }
    flushT(); flushP();
    return out.join("");
    })();
  }).join("");

    ? "<pre><code>" + esc(part.replace(/^[\w-]*\n/, "").replace(/\n$/, "")) + "</code></pre>"

      const r = await gh(`/repos/${c.owner}/${c.repo}`, {}, c);
      if (!r.permissions || !r.permissions.push) throw { code: 403, message: "your account can't push to this repo" };
      // Write check: a stale sha on posts.json is rejected (409/422) only after GitHub has checked write permission (403), so nothing changes. If posts.json is missing it gets created as an empty list.
      try {
        await gh(`/repos/${c.owner}/${c.repo}/contents/${c.path}`, { method: "PUT", body: JSON.stringify({ message: "blog: create posts.json", content: b64e("[]\n"), sha: "0000000000000000000000000000000000000000", branch: c.branch }) }, c);
      } catch (w) { if (w.code === 401 || w.code === 403 || w.code === 404) throw w; }
      ghStore(c); setBusy(false); onConnect(c); return;
    } catch (err) { setStatus(ghErr(err)); }
    setBusy(false);
  }
  return html`<main class="page admin"><div class="wrap narrow">
    <div class="sec-head"><div><span class="tag">// admin</span><h1 class="page-title">${title}</h1></div><p>${intro}</p></div>
    <form class="admin-form" onSubmit=${connect}>
      <h3>Connect GitHub</h3>
      <div class="frow">
        <div class="fld"><label for="g-owner">GitHub username</label><input id="g-owner" value=${conn.owner} onInput=${(e) => setConn({ ...conn, owner: e.target.value })} autocomplete="username" /></div>
        <div class="fld"><label for="g-repo">Repo name</label><input id="g-repo" value=${conn.repo} onInput=${(e) => setConn({ ...conn, repo: e.target.value })} /></div>
        <div class="fld" style=${{ maxWidth: "140px" }}><label for="g-branch">Branch</label><input id="g-branch" value=${conn.branch} onInput=${(e) => setConn({ ...conn, branch: e.target.value })} /></div>
      </div>
      <div class="fld"><label for="g-token">Access token</label><input id="g-token" type="password" value=${conn.token} onInput=${(e) => setConn({ ...conn, token: e.target.value })} placeholder="github_pat_..." autocomplete="off" />
        <small class="hint">GitHub → Settings → Developer settings → Fine-grained tokens → Generate. Repository access: only this repo. Permissions: Contents → Read and write.</small></div>
      <div class="fsend"><button id="g-connect" class="btn primary" type="submit" disabled=${busy}>${busy ? "Connecting…" : "Connect"}</button>${status && html`<span class="status" role="status">${status}</span>`}</div>
      <p class="fnote">The token is stored only in this browser, never in the site's code. Use Disconnect to remove it.</p>
    </form>
  </div></main>`;
}

function AdminPanel({ owner }) {
  usePosts();
  const mode = owner ? "artifact" : (IS_ARTIFACT ? "denied" : "github");
  const [cfg, setCfg] = useState(ghCfg);
  const [ghState, setGhState] = useState("idle"); // idle | loading | ready
  const [form, setForm] = useState(() => {
    try {
      const d = JSON.parse(sessionStorage.getItem("admin-draft") || "null");
      if (d && !POSTS.some((p) => p.id === d.id && p.title === d.title && p.body === d.body)) return d;
      sessionStorage.removeItem("admin-draft");
      const sel = sessionStorage.getItem("admin-sel"); const sp = POSTS.find((p) => p.id === sel);
      if (sp) return toForm(sp);
    } catch (e) {}
    const first = sortPosts(POSTS)[0];
    return first ? toForm(first) : { ...BLANK };
  });
  const [tab, setTab] = useState("content");
  const [status, setStatus] = useState("");
  const [busy, setBusy] = useState(false);
  const [confirmDel, setConfirmDel] = useState(false);
  const [tbl, setTbl] = useState(null); // null or {r, c}
  const [imgBusy, setImgBusy] = useState(false);
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });
  const pick = (p) => { setForm(p ? toForm(p) : { ...BLANK }); setConfirmDel(false); setStatus(""); try { sessionStorage.setItem("admin-sel", p ? p.id : ""); } catch (e) {} };

  useEffect(() => {
    if (mode !== "github" || !cfg) return;
    let alive = true;
    setGhState("loading");
    ghLoad(cfg).then((r) => {
      if (!alive) return;
      ghSha = r.sha; setPosts(r.posts); setGhState("ready");
      setForm((f) => (f.id || f.title || f.body) ? f : (sortPosts(r.posts)[0] ? toForm(sortPosts(r.posts)[0]) : f));
    }).catch((e) => { if (!alive) return; setGhState("idle"); setStatus(ghErr(e)); if (e.code === 401) { ghStore(null); setCfg(null); } });
    return () => { alive = false; };
  }, [mode, cfg]);

  if (owner === null) return html`<main class="page"><div class="wrap"><p class="status">Checking access…</p></div></main>`;
  if (mode === "denied") return html`<main class="page"><div class="wrap">
    <div class="empty" style=${{ gridTemplateColumns: "1fr" }}><div><h3>This area is for the site owner</h3><p>Blogs are managed here by Rahul. You can read everything on the Learning Blogs page.</p><a class="btn primary" href="#blogs">Go to Learning Blogs</a></div></div>
  </div></main>`;

  const disconnect = () => { ghStore(null); setCfg(null); setStatus("Disconnected. The token was removed from this browser."); };

  if (mode === "github" && !cfg) return html`<${GhConnect} title="Blog admin" intro="Connect your GitHub repo once on this device. Blogs you publish are saved to posts.json in that repo." note=${status} onConnect=${(c) => { setStatus(""); setCfg(c); }} />`;

  async function save(next, draft, label) {
    setBusy(true);
    try { if (draft) { sessionStorage.setItem("admin-draft", JSON.stringify(draft)); sessionStorage.setItem("admin-sel", draft.id); } } catch (e) {}
    if (mode === "artifact") {
      setStatus("Publishing…");
      try {
        const art = await claude.use("artifact");
        await art.publish(buildDoc(next));
        setStatus("Published. The site is reloading with your changes…");
      } catch (e) {
        const c = e && e.code;
        if (c === "conflict") setStatus("CONFLICT");
        else if (c === "not_writer" || c === "not_granted") setStatus("This view is read-only, so it can't publish. Open the page from your Claude artifacts.");
        else if (c === "no_source") setStatus("This copy of the page can't republish itself. Open it from your Claude artifacts and try again.");
        else setStatus("Couldn't publish (" + (c || "error") + "). Wait a moment and try again.");
      }
      setBusy(false); return;
    }
    setStatus("Publishing to GitHub…");
    try {
      ghSha = await ghSave(next, ghSha, label);
      setPosts(next);
      try { sessionStorage.removeItem("admin-draft"); } catch (e) {}
      setStatus("Published. Your live site shows it after GitHub Pages redeploys, usually within a minute.");
      if (!draft) pick(sortPosts(next)[0] || null); else setForm({ ...draft });
    } catch (e) {
      if (e.code === 409 || e.code === 422) {
        try { const r = await ghLoad(); ghSha = r.sha; setPosts(r.posts); } catch (x) {}
        setStatus("Your blog list changed on GitHub since this page loaded. The latest list is loaded now; press Publish again.");
      } else setStatus(ghErr(e));
    }
    setBusy(false);
  }
  function submit(e) {
    e.preventDefault();
    if (!form.title.trim() || !form.body.trim()) { setStatus("Add a title and the blog content before publishing."); return; }
    const entry = fromForm(form);
    const draft = { ...form, id: entry.id, date: entry.date };
    save([entry, ...POSTS.filter((p) => p.id !== entry.id)], draft, (form.id ? "blog: update " : "blog: add ") + entry.title);
  }
  const preview = fromForm(form);
  const posts = sortPosts(POSTS);

  // formatting toolbar: inserts markdown at the cursor in the notes box
  const area = () => document.getElementById("a-body");
  function insert(before, after = "", ph = "") {
    const ta = area(), v = form.body, a = ta ? ta.selectionStart : v.length, b = ta ? ta.selectionEnd : v.length;
    const sel = v.slice(a, b) || ph;
    setForm((f) => ({ ...f, body: v.slice(0, a) + before + sel + after + v.slice(b) }));
    requestAnimationFrame(() => { const t = area(); if (t) { t.focus(); t.setSelectionRange(a + before.length, a + before.length + sel.length); } });
  }
  function block(text) {
    const ta = area(), v = form.body, a = ta ? ta.selectionEnd : v.length;
    const pre = v.slice(0, a), lead = !pre ? "" : pre.endsWith("\n\n") ? "" : pre.endsWith("\n") ? "\n" : "\n\n";
    const next = pre + lead + text + "\n\n" + v.slice(a).replace(/^\n+/, "");
    setForm((f) => ({ ...f, body: next }));
    requestAnimationFrame(() => { const t = area(); if (t) { const pos = (pre + lead + text).length; t.focus(); t.setSelectionRange(pos, pos); } });
  }
  async function addImage(file) {
    if (!file || !IMG_EXT[file.type]) { setStatus("Choose a PNG, JPG, GIF or WebP image."); return; }
    if (file.size > 15e6) { setStatus("That image is over 15 MB. Pick a smaller one."); return; }
    setImgBusy(true); setStatus("Adding image…");
    try {
      const { blob, ext } = await shrinkImage(file, mode === "artifact" ? 1200 : 1800);
      const alt = (file.name || "image").replace(/\.[^.]+$/, "").replace(/[-_]+/g, " ").trim().slice(0, 60) || "image";
      let src;
      if (mode === "artifact") src = await blobToDataURL(blob);
      else {
        const name = "images/" + Date.now().toString(36) + "-" + (alt.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 30) || "img") + "." + ext;
        const b64 = (await blobToDataURL(blob)).split(",")[1];
        await gh(`/repos/${cfg.owner}/${cfg.repo}/contents/${name}`, { method: "PUT", body: JSON.stringify({ message: "blog: add image " + name, content: b64, branch: cfg.branch }) });
        src = `https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch}/${name}`;
      }
      block("![" + alt + "](" + src + ")");
      setStatus("Image added. Edit the text in [ ] to change its caption, then publish.");
    } catch (e) { setStatus(mode === "github" ? ghErr(e) : "Couldn't add that image. Try a smaller file."); }
    setImgBusy(false);
  }
  const onPaste = (e) => { const it = [...((e.clipboardData && e.clipboardData.items) || [])].find((i) => i.type && i.type.startsWith("image/")); if (it) { e.preventDefault(); addImage(it.getAsFile()); } };
  const onDrop = (e) => { const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f && f.type.startsWith("image/")) { e.preventDefault(); addImage(f); } };

  return html`<main class="page admin"><div class="wrap">
    <div class="sec-head"><div><span class="tag">// admin</span><h1 class="page-title">Blog admin</h1></div>
      <p>${mode === "github"
        ? html`Connected to <b>${cfg.owner}/${cfg.repo}</b>. What you publish here is saved to posts.json and goes live on Learning Blogs. <button class="linkbtn" id="g-disconnect" onClick=${disconnect}>Disconnect</button>`
        : "Only you can open this page. What you publish here goes live on Learning Blogs straight away."}</p></div>
    ${ghState === "loading" && html`<p class="status" style=${{ marginBottom: "16px" }}>Loading your blogs from GitHub…</p>`}
    <div class="admin-grid">
      <aside class="admin-list" aria-label="Your blogs">
        <button id="a-new" class="btn primary" onClick=${() => pick(null)}>+ Write new blog</button>
        <div class="alist">
          ${posts.length === 0 && html`<p class="muted-s">No blogs yet.</p>`}
          ${posts.map((p) => html`<button key=${p.id} class=${"arow" + (form.id === p.id ? " on" : "")} onClick=${() => pick(p)}>
            <b>${p.title}</b><span><i class=${"sdot " + (p.status === "completed" ? "c" : "p")}></i>${statusLabel(p.status)} · ${fmtDate(p.updated || p.date)}</span>
          </button>`)}
        </div>
        <a class="btn" href="#blogs">View blogs page</a>
      </aside>

      <form class="admin-form" onSubmit=${submit}>
        <div class="aform-head"><h3>${form.id ? "Edit blog" : "Write new blog"}</h3>${form.id && html`<a class="muted-s" href=${"#blog-" + form.id}>Open blog page ↗</a>`}</div>
        <div class="fld"><label for="a-title">Title</label><input id="a-title" value=${form.title} onInput=${set("title")} placeholder="Kubernetes" /></div>
        <div class="frow">
          <div class="fld"><label for="a-tag">Topic</label><input id="a-tag" list="a-tags" value=${form.tag} onInput=${set("tag")} placeholder="Kubernetes" />
            <datalist id="a-tags">${["Linux", "Docker", "Kubernetes", "CI/CD", "AWS", "Terraform", "System Design", "Networking"].map((t) => html`<option key=${t} value=${t}></option>`)}</datalist></div>
          <div class="fld"><label for="a-status">Status</label><select id="a-status" value=${form.status} onChange=${set("status")}><option value="in-progress">In progress</option><option value="completed">Completed</option></select></div>
          <div class="fld"><label for="a-period">Period</label><input id="a-period" value=${form.period} onInput=${set("period")} placeholder="Oct 2026 – Present" /></div>
        </div>
        <div class="fld"><label for="a-summary">Short description <small>(shown on the card)</small></label><input id="a-summary" value=${form.summary} onInput=${set("summary")} placeholder="How I'm learning Kubernetes from pods to deployments" /></div>
        <div class="frow">
          <div class="fld" style=${{ flex: 2 }}><label for="a-tech">Topics covered <small>(comma separated)</small></label><input id="a-tech" value=${form.tech} onInput=${set("tech")} placeholder="Pods, Deployments, Services, kubectl" /></div>
          <div class="fld" style=${{ flex: 1 }}><label for="a-cover">Cover letters <small>(optional)</small></label><input id="a-cover" maxLength="3" value=${form.cover} onInput=${set("cover")} placeholder=${initials(preview)} /></div>
        </div>
        <div class="fld"><label for="a-points">Key takeaways <small>(one per line)</small></label><textarea id="a-points" rows="3" value=${form.points} onInput=${set("points")} placeholder=${"A Deployment manages ReplicaSets\nServices give pods a stable address"}></textarea></div>
        <div class="fld"><label for="a-body">Notes</label>
          <div class="mdbar" role="toolbar" aria-label="Formatting">
            <button type="button" id="t-h" onClick=${() => block("## " + "Heading")} title="Heading">H</button>
            <button type="button" id="t-b" onClick=${() => insert("**", "**", "bold text")} title="Bold"><b>B</b></button>
            <button type="button" id="t-code" onClick=${() => insert("`", "`", "command")} title="Inline code">${"<>"}</button>
            <button type="button" id="t-block" onClick=${() => block("```bash\nkubectl get pods\n```")} title="Code block">Code block</button>
            <button type="button" id="t-list" onClick=${() => block("- point one\n- point two")} title="Bullet list">• List</button>
            <button type="button" id="t-link" onClick=${() => insert("[", "](https://)", "link text")} title="Link">Link</button>
            <button type="button" id="t-table" class=${tbl ? "on" : ""} onClick=${() => setTbl(tbl ? null : { r: 3, c: 2 })} title="Table">Table</button>
            <label class=${"imgbtn" + (imgBusy ? " busy" : "")} title="Upload image">${imgBusy ? "Uploading…" : "Image"}<input id="a-img" type="file" accept="image/png,image/jpeg,image/gif,image/webp" disabled=${imgBusy} onChange=${(e) => { addImage(e.target.files[0]); e.target.value = ""; }} /></label>
          </div>
          ${tbl && html`<div class="tblpick">
            <label for="t-rows">Rows</label><input id="t-rows" type="number" min="1" max="30" value=${tbl.r} onInput=${(e) => setTbl({ ...tbl, r: Math.max(1, Math.min(30, +e.target.value || 1)) })} />
            <label for="t-cols">Columns</label><input id="t-cols" type="number" min="1" max="8" value=${tbl.c} onInput=${(e) => setTbl({ ...tbl, c: Math.max(1, Math.min(8, +e.target.value || 1)) })} />
            <button type="button" id="t-insert" class="btn primary" onClick=${() => { block(makeTable(tbl.r, tbl.c)); setTbl(null); }}>Insert table</button>
            <small class="hint">Then type inside the | cells. The first row is the header.</small>
          </div>`}
          <textarea id="a-body" class="mono" rows="16" value=${form.body} onInput=${set("body")} onPaste=${onPaste} onDrop=${onDrop} placeholder=${"## What I learned today\nWrite your notes here...\n\n- point one\n- point two\n\n```bash\nkubectl get pods\n```"}></textarea>
          <small class="hint">Tip: paste a screenshot (Ctrl+V) or drag an image into the box to add it.</small></div>

        <div class="ptabs" role="tablist" aria-label="Preview">
          <button type="button" role="tab" aria-selected=${tab === "content"} class=${"tagbtn" + (tab === "content" ? " on" : "")} onClick=${() => setTab("content")}>Notes preview</button>
          <button type="button" role="tab" aria-selected=${tab === "card"} class=${"tagbtn" + (tab === "card" ? " on" : "")} onClick=${() => setTab("card")}>Card preview</button>
        </div>
        ${tab === "card"
          ? html`<div class="pcard"><${BlogCard} p=${preview} preview=${true} /></div>`
          : html`<div class="prose preview" dangerouslySetInnerHTML=${{ __html: mdToHtml(form.body) || '<p class="muted">Your notes will appear here.</p>' }}></div>`}

        <div class="fsend">
          <button id="a-publish" class="btn primary" type="submit" disabled=${busy}>${busy ? "Publishing…" : form.id ? "Update blog" : "Publish blog"}</button>
          ${form.id && (confirmDel
            ? html`<button id="a-confirm-delete" class="btn danger" type="button" disabled=${busy} onClick=${() => { const t = form.title; try { sessionStorage.removeItem("admin-draft"); sessionStorage.removeItem("admin-sel"); } catch (e) {} setConfirmDel(false); save(POSTS.filter((p) => p.id !== form.id), null, "blog: delete " + t); }}>Confirm delete</button><button class="btn" type="button" onClick=${() => setConfirmDel(false)}>Keep it</button>`
            : html`<button id="a-delete" class="btn" type="button" onClick=${() => setConfirmDel(true)}>Delete</button>`)}
          ${status && status !== "CONFLICT" && html`<span class="status" role="status">${status}</span>`}
        </div>
        ${status === "CONFLICT" && html`<div class="conflict" role="alert">
          <div><b>This tab has an older copy of the site.</b><span>Your blog is saved as a draft. Reload to get the latest copy, then press ${form.id ? "Update" : "Publish"} again.</span></div>
          <button id="a-reload" class="btn primary" type="button" onClick=${() => location.reload()}>Reload latest</button>
        </div>`}
      </form>
    </div>
  </div></main>`;
}

// Fills every field of the defaults from saved data of the same type, so older site.json files keep working when fields are added.
function mergeSite(def, v) {
  if (Array.isArray(def)) return Array.isArray(v) ? v : def;
  if (def && typeof def === "object") {
    const src = v && typeof v === "object" && !Array.isArray(v) ? v : {}, o = {};
    for (const k in def) o[k] = mergeSite(def[k], src[k]);
    return o;
  }
  if (typeof def === "boolean") return typeof v === "boolean" ? v : def;
  return typeof v === "string" ? v : def;
}
// Trims text and drops blank lines and empty list items before saving.
function cleanSite(v) {
  if (Array.isArray(v)) return v.map(cleanSite).filter((x) => typeof x === "string" ? x !== ""
    : !(x && typeof x === "object" && Object.values(x).every((y) => y === "" || y === false || (Array.isArray(y) && !y.length))));
  if (v && typeof v === "object") return Object.fromEntries(Object.entries(v).map(([k, x]) => [k, cleanSite(x)]));
  return typeof v === "string" ? v.trim() : v;
}
