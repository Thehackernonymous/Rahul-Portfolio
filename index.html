function SiteField({ f, value, onChange, idp }) {
  const id = idp + "-" + f.k;
  if (f.type === "list") return html`<${SiteList} f=${f} value=${Array.isArray(value) ? value : []} onChange=${onChange} idp=${id} />`;
  if (f.type === "object") return html`<fieldset class="sgroup"><legend>${f.label}</legend>
    ${f.fields.map((c) => html`<${SiteField} key=${c.k} f=${c} value=${(value || {})[c.k]} onChange=${(v) => onChange({ ...(value || {}), [c.k]: v })} idp=${id} />`)}</fieldset>`;
  if (f.type === "bool") return html`<label class="scheck"><input type="checkbox" id=${id} checked=${!!value} onChange=${(e) => onChange(e.target.checked)} />${f.label}</label>`;
  let input;
  if (f.type === "textarea" || f.type === "lines") input = html`<textarea id=${id} rows=${f.rows || (f.type === "lines" ? 4 : 3)} placeholder=${f.ph || ""}
    value=${f.type === "lines" ? (Array.isArray(value) ? value : []).join("\n") : value || ""} onInput=${(e) => onChange(f.type === "lines" ? e.target.value.split("\n") : e.target.value)}></textarea>`;
  else if (f.type === "select") input = html`<select id=${id} value=${value || f.options[0][0]} onChange=${(e) => onChange(e.target.value)}>${f.options.map(([v, l]) => html`<option key=${v} value=${v}>${l}</option>`)}</select>`;
  else input = html`<input id=${id} type=${f.type === "url" ? "url" : "text"} value=${value || ""} placeholder=${f.ph || ""} onInput=${(e) => onChange(e.target.value)} />`;
  const badUrl = f.type === "url" && String(value || "").trim() && !okHref(value);
  return html`<div class=${"fld" + (f.half ? " half" : "")}><label for=${id}>${f.label}</label>${input}
    ${badUrl ? html`<small class="ferr">Use a full link starting with https:// (or #section). Other links are ignored.</small>` : f.hint && html`<small class="hint">${f.hint}</small>`}</div>`;
}

function SiteList({ f, value, onChange, idp }) {
  const [added, setAdded] = useState(-1);
  const set = (i, v) => onChange(value.map((x, j) => (j === i ? v : x)));
  const move = (i, d) => { const a = [...value]; [a[i], a[i + d]] = [a[i + d], a[i]]; onChange(a); };
  return html`<div class="slist">
    <div class="slist-head"><b>${f.label}</b>${f.hint && html`<small class="hint">${f.hint}</small>`}</div>
    ${value.map((it, i) => html`<details class="sitem" key=${i} open=${i === added}>
      <summary>${(f.title && f.title(it || {})) || f.itemName + " " + (i + 1)}</summary>
      <div class="sfields">${f.item.map((c) => html`<${SiteField} key=${c.k} f=${c} value=${(it || {})[c.k]} onChange=${(v) => set(i, { ...(it || {}), [c.k]: v })} idp=${idp + "-" + i} />`)}</div>
      <div class="sitem-act">
        <button type="button" class="btn" disabled=${i === 0} onClick=${() => move(i, -1)}>↑ Up</button>
        <button type="button" class="btn" disabled=${i === value.length - 1} onClick=${() => move(i, 1)}>↓ Down</button>
        <button type="button" class="btn danger" onClick=${() => onChange(value.filter((_, j) => j !== i))}>Remove</button>
      </div>
    </details>`)}
    <button type="button" class="btn" onClick=${() => { onChange([...value, JSON.parse(JSON.stringify(f.blank))]); setAdded(value.length); }}>+ Add ${f.itemName.toLowerCase()}</button>
  </div>`;
}

const SITE_DRAFT_KEY = "site-editor-draft";
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
function SiteEditor() {
  const [cfg, setCfg] = useState(IS_ARTIFACT ? null : ghCfg);
  const [pub, setPub] = useState(null);
  const [draft, setDraft] = useState(null);
  const [sec, setSec] = useState("hero");
  const [status, setStatus] = useState("");
  const [busy, setBusy] = useState(false);
  useEffect(() => { if (PREVIEW) setSite(SITE_PUBLISHED); }, []);
  useEffect(() => {
    if (!cfg) return;
    let alive = true;
    setStatus("");
    ghLoadFile("site.json", cfg).then(({ data, sha }) => {
      if (!alive) return;
      siteSha = sha;
      const p = mergeSite(DEFAULT_SITE, data || {});
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(SITE_DRAFT_KEY) || "null"); } catch (e) {}
      setPub(p); setDraft(saved ? mergeSite(DEFAULT_SITE, saved) : p);
    }).catch((e) => { if (!alive) return; setStatus(ghErr(e)); if (e.code === 401) { ghStore(null); setCfg(null); } });
    return () => { alive = false; };
  }, [cfg]);
  useEffect(() => {
    if (!draft || !pub) return;
    try { if (same(draft, pub)) localStorage.removeItem(SITE_DRAFT_KEY); else localStorage.setItem(SITE_DRAFT_KEY, JSON.stringify(draft)); } catch (e) {}
  }, [draft, pub]);

  if (IS_ARTIFACT) return html`<main class="page"><div class="wrap"><div class="empty" style=${{ gridTemplateColumns: "1fr" }}><div><h3>Edit on your live site</h3><p>The site editor saves to your GitHub repo. Open /me on your GitHub Pages site to use it.</p></div></div></div></main>`;
  if (!cfg) return html`<${GhConnect} title="Edit your site" intro="Connect your GitHub repo once on this device. Everything you edit here is saved to site.json in that repo, and the live site updates about a minute later." note=${status} onConnect=${setCfg} />`;
  if (!draft) return html`<main class="page"><div class="wrap"><p class="status">${status || "Loading your site content from GitHub…"}</p></div></main>`;

  const dirty = !same(draft, pub);
  const S = SECTIONS.find((x) => x.id === sec);
  const disconnect = () => { ghStore(null); setCfg(null); setPub(null); setDraft(null); };
  async function publish() {
    setBusy(true); setStatus("Publishing to GitHub…");
    const clean = cleanSite(draft);
    try {
      siteSha = await ghSaveFile("site.json", clean, siteSha, "site: update content");
      const merged = mergeSite(DEFAULT_SITE, clean);
      setPub(merged); setDraft(merged); SITE_PUBLISHED = merged; setSite(merged);
      setStatus("Published. The live site shows it after GitHub Pages redeploys, usually within a minute.");
    } catch (e) {
      if (e.code === 409 || e.code === 422) {
        try { siteSha = (await ghLoadFile("site.json")).sha; } catch (x) {}
        setStatus("site.json changed on GitHub since this page loaded. Press Publish again to save your version over it.");
      } else setStatus(ghErr(e));
    }
    setBusy(false);
  }
  const preview = () => { setSite(mergeSite(DEFAULT_SITE, cleanSite(draft)), true); location.hash = "top"; };
  const discard = () => { setDraft(pub); setStatus("Unpublished changes discarded."); };

  return html`<main class="page admin"><div class="wrap">
    <div class="sec-head"><div><span class="tag">// me</span><h1 class="page-title">Edit your site</h1></div>
      <p>Connected to <b>${cfg.owner}/${cfg.repo}</b>. Changes go live about a minute after you publish. <button class="linkbtn" id="s-disconnect" onClick=${disconnect}>Disconnect</button></p></div>
    <div class="mehub"><a class="btn" href="#top">View site</a><a class="btn" href="#admin">Blogs</a>${CHAT_ON && html`<a class="btn" href="#message">Messages</a>`}</div>
    <div class="admin-grid">
      <aside class="admin-list" aria-label="Sections">
        <div class="alist" style=${{ maxHeight: "none" }}>
          ${SECTIONS.map((x) => html`<button key=${x.id} id=${"sec-" + x.id} class=${"arow" + (x.id === sec ? " on" : "")} onClick=${() => setSec(x.id)}>
            <b>${x.label}</b>${!same(draft[x.id], pub[x.id]) && html`<span><i class="sdot"></i>Unpublished changes</span>`}</button>`)}
        </div>
      </aside>
      <form class="admin-form" onSubmit=${(e) => { e.preventDefault(); publish(); }}>
        <div class="aform-head"><h3>${S.label}</h3></div>
        <div class="sfields" key=${sec}>${S.fields.map((f) => html`<${SiteField} key=${f.k} f=${f} value=${draft[sec][f.k]} onChange=${(v) => { setDraft((d) => ({ ...d, [sec]: { ...d[sec], [f.k]: v } })); setStatus(""); }} idp=${"s-" + sec} />`)}</div>
      </form>
    </div>
    <div class="sbar">
      <span class=${"status" + (dirty || status ? " warn" : "")} role="status">${status || (dirty ? "You have unpublished changes." : "Everything is published.")}</span>
      ${dirty && html`<button class="btn" id="s-discard" type="button" onClick=${discard} disabled=${busy}>Discard</button>`}
      <button class="btn" id="s-preview" type="button" onClick=${preview}>Preview</button>
      <button class="btn primary" id="s-publish" type="button" onClick=${publish} disabled=${busy || !dirty}>${busy ? "Publishing…" : "Publish"}</button>
    </div>
  </div></main>`;
}

function useRoute() {
  const get = () => {
    const h = location.hash.slice(1);
    if (h === "blogs") return { v: "blogs" };
    if (h === "admin") return { v: "admin" };
    if (h === "message" || h === "messages") return { v: "message" };
    if (h === "me") return { v: "me" };
    const m = h.match(/^blog-([a-z0-9-]+)$/);
    if (m) return { v: "post", id: m[1] };
    return { v: "home", anchor: h };
  };
  const [r, setR] = useState(get);
  useEffect(() => { const f = () => setR(get()); addEventListener("hashchange", f); return () => removeEventListener("hashchange", f); }, []);
  return r;
}

let ownerCheck = null;
function checkOwner() {
  if (!ownerCheck) ownerCheck = (async () => {
    if (!window.claude || !window.claude.use) return false;
    const [u, a] = await Promise.all([claude.use("user"), claude.use("artifact")]);
    if (!u || !a) return false;
    return !!(await u.canEdit());
  })().catch(() => false);
  return ownerCheck;
}
function useOwner() {
  const [s, setS] = useState(null);
  useEffect(() => {
    const t = setTimeout(() => setS((v) => (v === null ? false : v)), 11000);
    checkOwner().then((v) => { clearTimeout(t); setS(v); });
    return () => clearTimeout(t);
  }, []);
  return s;
}

function App() {
  const r = useRoute();
  const S = useSite();
  const owner = useOwner();
  useEffect(() => {
    if (r.v === "home" && r.anchor) { const el = document.getElementById(r.anchor); if (el) requestAnimationFrame(() => el.scrollIntoView()); }
    else if (r.v !== "home") scrollTo(0, 0);
  }, [r.v, r.id, r.anchor]);
  let page;
  if (r.v === "blogs") page = html`<${BlogList} owner=${owner} />`;
  else if (r.v === "post") page = html`<${BlogDetail} id=${r.id} owner=${owner} />`;
  else if (r.v === "admin") page = html`<${AdminPanel} owner=${owner} />`;
  else if (r.v === "message") page = html`<${MessagesPage} />`;
  else if (r.v === "me") page = html`<${SiteEditor} />`;
  else page = html`<${Home} />`;
  return html`
  <${CardNav} />
  ${page}
  ${CHAT_ON && r.v !== "message" && r.v !== "me" && html`<${TalkToMe} />`}
  ${PREVIEW && r.v !== "me" && html`<div class="pvbar" role="status"><span>Previewing unpublished changes</span><a class="btn primary" href="#me">Back to editor</a><button class="btn" onClick=${() => setSite(SITE_PUBLISHED)}>Exit preview</button></div>`}
  <footer><div class="wrap"><span>${S.site.footer}</span><span>${(owner || (!IS_ARTIFACT && ghCfg())) && r.v !== "me" ? html`<a href="#me">Edit site</a>` : ""}</span></div></footer>
  `;
}

// Waits briefly for site.json so visitors don't see the default content flash first; a slow fetch still updates the page when it lands.
function boot() {
  capturePage();
  let started = false;
  const start = () => { if (started) return; started = true; ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`); loadRemotePosts(); };
  loadSite().finally(start);
  setTimeout(start, 1200);
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
</script>
